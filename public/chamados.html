function ValoresMargemPage({ chamados, onEditar }) {
  const [busca, setBusca] = useState("");

  const valorProjetoTotal = useMemo(
    () => chamados.reduce((s, c) => s + Number(c.valor_projeto || 0), 0),
    [chamados]
  );
  const descontoTotal = useMemo(
    () => chamados.reduce((s, c) => s + Number(c.desconto_negociado || 0), 0),
    [chamados]
  );
  const valorRecebido = useMemo(
    () => chamados.reduce((s, c) => s + Number(c.valor_total_projeto || 0), 0),
    [chamados]
  );
  const margemMedia = useMemo(() => {
    const comHoras = chamados.filter((c) => Number(c.horas_dev) > 0);
    if (!comHoras.length) return 0;
    return comHoras.reduce((s, c) => s + Number(c.pct_margem || 0), 0) / comHoras.length;
  }, [chamados]);

  const valorPorMes = useMemo(() => {
    const nomesMes = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
    const anoFoco = new Date().getFullYear();
    const valores = Array(12).fill(0);
    chamados.forEach((c) => {
      if (!c.data_abertura) return;
      const d = parseDataLocal(c.data_abertura);
      if (d.getFullYear() === anoFoco) valores[d.getMonth()] += Number(c.valor_total_projeto || 0);
    });
    let ultimoMes = 0;
    valores.forEach((v, i) => {
      if (v > 0) ultimoMes = i;
    });
    return nomesMes.slice(0, ultimoMes + 1).map((mes, i) => ({ mes, valor: Math.round(valores[i]) }));
  }, [chamados]);

  const topClientesValor = useMemo(() => {
    const contagem = {};
    chamados.forEach((c) => {
      contagem[c.cliente_nome] = (contagem[c.cliente_nome] || 0) + Number(c.valor_total_projeto || 0);
    });
    return Object.entries(contagem)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8)
      .map(([nome, valor]) => ({ nome, valor: Math.round(valor) }));
  }, [chamados]);

  const filtrados = useMemo(() => {
    return chamados
      .filter(
        (c) =>
          !busca.trim() ||
          `${c.numero} ${c.cliente_nome} ${c.descricao || ""}`.toLowerCase().includes(busca.trim().toLowerCase())
      )
      .sort((a, b) => Number(b.valor_total_projeto || 0) - Number(a.valor_total_projeto || 0))
      .slice(0, 100);
  }, [chamados, busca]);

  const fmtMoeda = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const fmtPct = (v) => `${Math.round(Number(v || 0) * 100)}%`;

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap gap-4">
        <KpiCard label="Valor Total dos Projetos" value={fmtMoeda(valorProjetoTotal)} accent="#0F172A" />
        <KpiCard label="Desconto Negociado" value={fmtMoeda(descontoTotal)} accent="#C4573D" />
        <KpiCard label="Valor Recebido" value={fmtMoeda(valorRecebido)} accent="#0F8A6B" />
        <KpiCard label="Margem Média" value={fmtPct(margemMedia)} accent="#7C3AED" />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="bg-white border border-slate-200 rounded-lg p-5">
          <h2 className="text-sm font-semibold text-slate-800 mb-4">
            Valor Recebido por Mês · {new Date().getFullYear()}
          </h2>
          <ResponsiveContainer width="100%" height={220}>
            <LineChart data={valorPorMes}>
              <CartesianGrid stroke="#EEF0EC" vertical={false} />
              <XAxis dataKey="mes" tick={{ fontSize: 12, fill: "#94a3b8" }} axisLine={false} tickLine={false} />
              <YAxis
                tick={{ fontSize: 11, fill: "#94a3b8" }}
                axisLine={false}
                tickLine={false}
                tickFormatter={(v) => `${Math.round(v / 1000)}k`}
              />
              <Tooltip formatter={(v) => fmtMoeda(v)} />
              <Line type="monotone" dataKey="valor" stroke={BRAND_BLUE} strokeWidth={2.5} dot={{ r: 3 }} />
            </LineChart>
          </ResponsiveContainer>
        </div>

        <div className="bg-white border border-slate-200 rounded-lg p-5">
          <h2 className="text-sm font-semibold text-slate-800 mb-4">Top Clientes por Valor</h2>
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={topClientesValor} layout="vertical" margin={{ left: 10 }}>
              <XAxis type="number" hide />
              <YAxis
                dataKey="nome"
                type="category"
                width={90}
                tick={{ fontSize: 11, fill: "#475569" }}
                axisLine={false}
                tickLine={false}
              />
              <Tooltip formatter={(v) => fmtMoeda(v)} />
              <Bar dataKey="valor" fill="#E0A526" radius={[0, 4, 4, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-md px-3 py-2 max-w-md shadow-sm">
        <Search size={14} className="text-slate-400" />
        <input
          value={busca}
          onChange={(e) => setBusca(e.target.value)}
          placeholder="Buscar por nº, cliente ou descrição"
          className="bg-transparent text-sm outline-none w-full placeholder:text-slate-400"
        />
      </div>

      <div className="bg-white rounded-xl shadow-sm overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-xs text-slate-400 border-b border-slate-100">
                <th className="px-4 py-3 font-medium">Nº</th>
                <th className="px-4 py-3 font-medium">Cliente</th>
                <th className="px-4 py-3 font-medium text-right">% Margem</th>
                <th className="px-4 py-3 font-medium text-right">Valor do Projeto</th>
                <th className="px-4 py-3 font-medium text-right">Desconto</th>
                <th className="px-4 py-3 font-medium text-right">Valor Total</th>
              </tr>
            </thead>
            <tbody>
              {filtrados.map((c) => (
                <tr
                  key={c.id}
                  onClick={() => onEditar && onEditar(c)}
                  className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 cursor-pointer"
                >
                  <td className="px-4 py-2.5 font-mono text-xs text-slate-400">#{c.numero}</td>
                  <td className="px-4 py-2.5 text-slate-700 font-medium whitespace-nowrap">{c.cliente_nome}</td>
                  <td className="px-4 py-2.5 text-right tabular-nums text-slate-600 whitespace-nowrap">
                    {fmtPct(c.pct_margem)}
                  </td>
                  <td className="px-4 py-2.5 text-right tabular-nums text-slate-600 whitespace-nowrap">
                    {fmtMoeda(c.valor_projeto)}
                  </td>
                  <td className="px-4 py-2.5 text-right tabular-nums text-[#C4573D] whitespace-nowrap">
                    -{fmtMoeda(c.desconto_negociado)}
                  </td>
                  <td className="px-4 py-2.5 text-right tabular-nums font-semibold text-slate-800 whitespace-nowrap">
                    {fmtMoeda(c.valor_total_projeto)}
                  </td>
                </tr>
              ))}
              {filtrados.length === 0 && (
                <tr>
                  <td colSpan={6} className="px-4 py-8 text-center text-slate-400 text-sm">
                    Nenhum chamado encontrado.
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
        <div className="px-4 py-3 border-t border-slate-100 text-xs text-slate-400">
          Mostrando os {filtrados.length} chamados de maior valor
          {busca.trim() ? " que batem com a busca" : ""}.
        </div>
      </div>
    </div>
  );
}

function PropostasEnviadasPage({ chamados, onEditar }) {
  const [busca, setBusca] = useState("");

  const propostas = useMemo(
    () => chamados.filter((c) => c.status === "Concluido" && c.proposta_status === "Enviado"),
    [chamados]
  );

  const diasAguardando = (data) => {
    if (!data) return null;
    return Math.floor((Date.now() - parseDataLocal(data).getTime()) / (1000 * 60 * 60 * 24));
  };

  const filtradas = useMemo(() => {
    return propostas
      .filter(
        (c) =>
          !busca.trim() ||
          `${c.numero} ${c.cliente_nome} ${c.descricao || ""}`.toLowerCase().includes(busca.trim().toLowerCase())
      )
      .sort((a, b) => parseDataLocal(a.data_envio_proposta || a.data_abertura) - parseDataLocal(b.data_envio_proposta || b.data_abertura));
  }, [propostas, busca]);

  const valorTotal = useMemo(() => propostas.reduce((s, c) => s + Number(c.valor_total_projeto || 0), 0), [propostas]);

  const diasMaximo = useMemo(() => {
    const dias = propostas.map((c) => diasAguardando(c.data_envio_proposta)).filter((d) => d !== null);
    return dias.length ? Math.max(...dias) : 0;
  }, [propostas]);

  const fmtMoeda = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const fmtData = (d) => (d ? parseDataLocal(d).toLocaleDateString("pt-BR") : "—");

  const corDias = (dias) => {
    if (dias === null) return "#94a3b8";
    if (dias > 30) return "#C4573D";
    if (dias > 15) return "#E0A526";
    return "#3A6EA5";
  };

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap gap-4">
        <KpiCard label="Propostas Enviadas" value={propostas.length} accent="#0F172A" />
        <KpiCard label="Valor Total em Aberto" value={fmtMoeda(valorTotal)} accent="#0F8A6B" />
        <KpiCard label="Mais Antiga (dias)" value={diasMaximo} accent="#E0A526" />
      </div>

      <p className="text-xs text-slate-400 -mt-2">
        Chamados já <strong>concluídos</strong> cuja proposta foi <strong>enviada</strong> mas ainda não voltou como
        aprovada, recusada ou cancelada.
      </p>

      <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-md px-3 py-2 max-w-md shadow-sm">
        <Search size={14} className="text-slate-400" />
        <input
          value={busca}
          onChange={(e) => setBusca(e.target.value)}
          placeholder="Buscar por nº, cliente ou descrição"
          className="bg-transparent text-sm outline-none w-full placeholder:text-slate-400"
        />
      </div>

      <div className="bg-white rounded-xl shadow-sm overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-xs text-slate-400 border-b border-slate-100">
                <th className="px-4 py-3 font-medium">Nº</th>
                <th className="px-4 py-3 font-medium">Cliente</th>
                <th className="px-4 py-3 font-medium">Descrição</th>
                <th className="px-4 py-3 font-medium">Analista</th>
                <th className="px-4 py-3 font-medium">Envio Proposta</th>
                <th className="px-4 py-3 font-medium text-right">Dias Aguardando</th>
                <th className="px-4 py-3 font-medium text-right">Valor do Projeto</th>
              </tr>
            </thead>
            <tbody>
              {filtradas.map((c) => {
                const dias = diasAguardando(c.data_envio_proposta);
                return (
                  <tr
                    key={c.id}
                    onClick={() => onEditar && onEditar(c)}
                    className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 cursor-pointer"
                  >
                    <td className="px-4 py-2.5 font-mono text-xs text-slate-400">#{c.numero}</td>
                    <td className="px-4 py-2.5 text-slate-700 font-medium whitespace-nowrap">{c.cliente_nome}</td>
                    <td className="px-4 py-2.5 text-slate-500 max-w-[240px] truncate">{c.descricao || "—"}</td>
                    <td className="px-4 py-2.5 text-slate-500 whitespace-nowrap">{c.analista_nome || "—"}</td>
                    <td className="px-4 py-2.5 text-slate-500 whitespace-nowrap">{fmtData(c.data_envio_proposta)}</td>
                    <td className="px-4 py-2.5 text-right whitespace-nowrap">
                      {dias !== null ? (
                        <span className="text-xs font-medium" style={{ color: corDias(dias) }}>
                          {dias}d
                        </span>
                      ) : (
                        "—"
                      )}
                    </td>
                    <td className="px-4 py-2.5 text-right tabular-nums font-semibold text-slate-800 whitespace-nowrap">
                      {fmtMoeda(c.valor_total_projeto)}
                    </td>
                  </tr>
                );
              })}
              {filtradas.length === 0 && (
                <tr>
                  <td colSpan={7} className="px-4 py-8 text-center text-slate-400 text-sm">
                    Nenhum chamado concluído com proposta enviada pendente.
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function CargaPorAnalistaPage({ chamados, analistas, onEditar }) {
  const [busca, setBusca] = useState("");
  const [expandido, setExpandido] = useState(null);

  const analistasAtivos = useMemo(() => analistas.filter((a) => a.ativo !== false), [analistas]);

  const STATUS_ABERTOS = ["A Iniciar", "Em Analise", "BackLog", "Aguard. Retorno do Cliente", "Aguard. Analise Desen.", "Aguard. Horas de Desen.", "Reunião Tecnica", "Enviar Proposta", "Novo Cliente"];

  const porAnalista = useMemo(() => {
    const grupos = {};
    chamados.forEach((c) => {
      const nome = c.analista_nome || "Sem analista";
      if (!grupos[nome]) grupos[nome] = [];
      grupos[nome].push(c);
    });
    return Object.entries(grupos)
      .map(([nome, itens]) => {
        const statusCount = {};
        itens.forEach((i) => {
          statusCount[i.status] = (statusCount[i.status] || 0) + 1;
        });
        const abertos = itens.filter((i) => STATUS_ABERTOS.includes(i.status)).length;
        const totalHoras = itens.reduce((s, i) => s + Number(i.total_horas || 0), 0);
        return {
          nome,
          itens: itens.sort((a, b) => parseDataLocal(b.data_abertura) - parseDataLocal(a.data_abertura)),
          total: itens.length,
          abertos,
          totalHoras,
          statusCount,
        };
      })
      .filter((g) => !busca.trim() || g.nome.toLowerCase().includes(busca.trim().toLowerCase()))
      .sort((a, b) => b.abertos - a.abertos);
  }, [chamados, busca]);

  const chamadosAbertos = useMemo(() => chamados.filter((c) => STATUS_ABERTOS.includes(c.status)).length, [chamados]);

  const fmtData = (d) => (d ? parseDataLocal(d).toLocaleDateString("pt-BR") : "—");

  const nomesAtivos = useMemo(() => new Set(analistasAtivos.map((a) => a.nome)), [analistasAtivos]);

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap gap-4">
        <KpiCard label="Analistas Ativos" value={analistasAtivos.length} accent="#0F172A" />
        <KpiCard label="Chamados em Aberto" value={chamadosAbertos} accent="#3A6EA5" />
        <KpiCard
          label="Média por Analista"
          value={analistasAtivos.length ? Math.round(chamadosAbertos / analistasAtivos.length) : 0}
          accent="#7C3AED"
        />
      </div>

      <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-md px-3 py-2 max-w-md shadow-sm">
        <Search size={14} className="text-slate-400" />
        <input
          value={busca}
          onChange={(e) => setBusca(e.target.value)}
          placeholder="Buscar analista"
          className="bg-transparent text-sm outline-none w-full placeholder:text-slate-400"
        />
      </div>

      <div className="space-y-2">
        {porAnalista.length === 0 && (
          <div className="bg-white rounded-xl shadow-sm p-8 text-center text-slate-400 text-sm">
            Nenhum analista encontrado.
          </div>
        )}
        {porAnalista.map((g) => {
          const aberto = expandido === g.nome;
          return (
            <div key={g.nome} className="bg-white rounded-xl shadow-sm overflow-hidden">
              <button
                onClick={() => setExpandido(aberto ? null : g.nome)}
                className="w-full flex items-center justify-between px-5 py-4 hover:bg-slate-50/60"
              >
                <div className="flex items-center gap-3">
                  <ChevronRight
                    size={16}
                    className={`text-slate-400 transition-transform ${aberto ? "rotate-90" : "rotate-0"}`}
                  />
                  <span className="font-semibold text-slate-800">{g.nome}</span>
                  {!nomesAtivos.has(g.nome) && (
                    <span className="text-[10px] font-medium px-1.5 py-0.5 rounded bg-slate-100 text-slate-400">
                      inativo
                    </span>
                  )}
                  <span
                    className="text-xs font-medium px-2 py-0.5 rounded-full"
                    style={{ backgroundColor: BRAND_BLUE + "1a", color: BRAND_BLUE }}
                  >
                    {g.abertos} em aberto
                  </span>
                  <span className="text-xs text-slate-400">{g.total} no total</span>
                </div>
                <span className="text-xs text-slate-500 tabular-nums">{Math.round(g.totalHoras)}h somadas</span>
              </button>

              <div className="px-5 pb-3 flex flex-wrap gap-1.5">
                {Object.entries(g.statusCount).map(([status, qtd]) => (
                  <span
                    key={status}
                    className="text-[11px] font-medium px-2 py-0.5 rounded-full"
                    style={{ backgroundColor: corStatus(status) + "1a", color: corStatus(status) }}
                  >
                    {status} · {qtd}
                  </span>
                ))}
              </div>

              {aberto && (
                <div className="border-t border-slate-100">
                  {g.itens.map((c) => (
                    <div
                      key={c.id}
                      onClick={() => onEditar && onEditar(c)}
                      className="flex items-center justify-between px-5 py-2.5 border-b border-slate-50 last:border-0 hover:bg-slate-50/60 cursor-pointer"
                    >
                      <div className="flex items-center gap-3 min-w-0">
                        <span className="font-mono text-xs text-slate-400 shrink-0">#{c.numero}</span>
                        <span className="text-sm text-slate-700 font-medium shrink-0">{c.cliente_nome}</span>
                        <span className="text-sm text-slate-500 truncate">{c.descricao || "—"}</span>
                      </div>
                      <div className="flex items-center gap-4 shrink-0">
                        <span className="text-xs text-slate-400">{fmtData(c.data_abertura)}</span>
                        <span
                          className="text-xs font-medium px-2 py-0.5 rounded-full"
                          style={{ backgroundColor: corStatus(c.status) + "1a", color: corStatus(c.status) }}
                        >
                          {c.status}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function BacklogPorClientePage({ chamados, onEditar }) {
  const [busca, setBusca] = useState("");
  const [expandido, setExpandido] = useState(null);

  const backlog = useMemo(() => chamados.filter((c) => c.status === "BackLog"), [chamados]);

  const diasAberto = (data) => {
    if (!data) return null;
    return Math.floor((Date.now() - parseDataLocal(data).getTime()) / (1000 * 60 * 60 * 24));
  };

  const porCliente = useMemo(() => {
    const grupos = {};
    backlog.forEach((c) => {
      const nome = c.cliente_nome || "Sem cliente";
      if (!grupos[nome]) grupos[nome] = [];
      grupos[nome].push(c);
    });
    return Object.entries(grupos)
      .map(([cliente, itens]) => {
        const dias = itens.map((i) => diasAberto(i.data_abertura)).filter((d) => d !== null);
        return {
          cliente,
          itens: itens.sort((a, b) => parseDataLocal(a.data_abertura) - parseDataLocal(b.data_abertura)),
          qtd: itens.length,
          diasMaisAntigo: dias.length ? Math.max(...dias) : null,
        };
      })
      .filter((g) => !busca.trim() || g.cliente.toLowerCase().includes(busca.trim().toLowerCase()))
      .sort((a, b) => b.qtd - a.qtd);
  }, [backlog, busca]);

  const diasMaximoGeral = useMemo(() => {
    const dias = backlog.map((c) => diasAberto(c.data_abertura)).filter((d) => d !== null);
    return dias.length ? Math.max(...dias) : 0;
  }, [backlog]);

  const corDias = (dias) => {
    if (dias === null) return "#94a3b8";
    if (dias > 60) return "#C4573D";
    if (dias > 30) return "#E0A526";
    return "#3A6EA5";
  };

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap gap-4">
        <KpiCard label="Chamados em Backlog" value={backlog.length} accent="#C4573D" />
        <KpiCard label="Clientes Afetados" value={porCliente.length} accent="#0F172A" />
        <KpiCard label="Mais Antigo (dias)" value={diasMaximoGeral} accent="#E0A526" />
      </div>

      <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-md px-3 py-2 max-w-md shadow-sm">
        <Search size={14} className="text-slate-400" />
        <input
          value={busca}
          onChange={(e) => setBusca(e.target.value)}
          placeholder="Buscar cliente"
          className="bg-transparent text-sm outline-none w-full placeholder:text-slate-400"
        />
      </div>

      <div className="space-y-2">
        {porCliente.length === 0 && (
          <div className="bg-white rounded-xl shadow-sm p-8 text-center text-slate-400 text-sm">
            Nenhum chamado em backlog encontrado.
          </div>
        )}
        {porCliente.map((g) => {
          const aberto = expandido === g.cliente;
          return (
            <div key={g.cliente} className="bg-white rounded-xl shadow-sm overflow-hidden">
              <button
                onClick={() => setExpandido(aberto ? null : g.cliente)}
                className="w-full flex items-center justify-between px-5 py-4 hover:bg-slate-50/60"
              >
                <div className="flex items-center gap-3">
                  <ChevronRight
                    size={16}
                    className={`text-slate-400 transition-transform ${aberto ? "rotate-90" : "rotate-0"}`}
                  />
                  <span className="font-semibold text-slate-800">{g.cliente}</span>
                  <span
                    className="text-xs font-medium px-2 py-0.5 rounded-full"
                    style={{ backgroundColor: "#C4573D1a", color: "#C4573D" }}
                  >
                    {g.qtd} {g.qtd === 1 ? "chamado" : "chamados"}
                  </span>
                </div>
                {g.diasMaisAntigo !== null && (
                  <span className="text-xs" style={{ color: corDias(g.diasMaisAntigo) }}>
                    até {g.diasMaisAntigo} dias em aberto
                  </span>
                )}
              </button>
              {aberto && (
                <div className="border-t border-slate-100">
                  {g.itens.map((c) => {
                    const dias = diasAberto(c.data_abertura);
                    return (
                      <div
                        key={c.id}
                        onClick={() => onEditar && onEditar(c)}
                        className="flex items-center justify-between px-5 py-2.5 border-b border-slate-50 last:border-0 hover:bg-slate-50/60 cursor-pointer"
                      >
                        <div className="flex items-center gap-3 min-w-0">
                          <span className="font-mono text-xs text-slate-400 shrink-0">#{c.numero}</span>
                          <span className="text-sm text-slate-600 truncate">{c.descricao || "—"}</span>
                        </div>
                        <div className="flex items-center gap-4 shrink-0">
                          <span className="text-xs text-slate-400">{c.analista_nome || "—"}</span>
                          {dias !== null && (
                            <span className="text-xs font-medium" style={{ color: corDias(dias) }}>
                              {dias}d
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ChamadosListaPage({ chamados, analistas, onEditar }) {
  const VAZIA = "(Vazia)";
  const [busca, setBusca] = useState("");
  const [statusFiltro, setStatusFiltro] = useState([]);
  const [analistaFiltro, setAnalistaFiltro] = useState(["Pedro", "Luciane", "Evandro", "Débora"]);
  const [propostaFiltro, setPropostaFiltro] = useState(["Enviado", VAZIA]);
  const [pagina, setPagina] = useState(1);
  const porPagina = 25;

  const statusDisponiveis = useMemo(
    () => [...new Set(chamados.map((c) => c.status).filter(Boolean))],
    [chamados]
  );

  const propostaDisponiveis = useMemo(
    () => [...new Set(chamados.map((c) => c.proposta_status || VAZIA))],
    [chamados]
  );

  const analistasDisponiveis = useMemo(() => analistas.map((a) => a.nome), [analistas]);

  const contagemPorStatus = useMemo(() => {
    const c = {};
    chamados.forEach((ch) => {
      c[ch.status] = (c[ch.status] || 0) + 1;
    });
    return c;
  }, [chamados]);

  const STATUS_OCULTOS_PADRAO = ["Encerrado", "Cancelado"];

  const filtrados = useMemo(() => {
    return chamados.filter((c) => {
      if (statusFiltro.length > 0) {
        if (!statusFiltro.includes(c.status)) return false;
      } else if (STATUS_OCULTOS_PADRAO.includes(c.status)) {
        // sem nenhum status escolhido manualmente, esconde Encerrado/Cancelado
        // por padrão (quem quiser vê-los, seleciona o chip do status direto)
        return false;
      }
      if (analistaFiltro.length > 0 && !analistaFiltro.includes(c.analista_nome)) return false;
      if (propostaFiltro.length > 0 && !propostaFiltro.includes(c.proposta_status || VAZIA)) return false;
      if (busca.trim()) {
        const alvo = `${c.numero} ${c.cliente_nome} ${c.descricao || ""}`.toLowerCase();
        if (!alvo.includes(busca.trim().toLowerCase())) return false;
      }
      return true;
    });
  }, [chamados, statusFiltro, analistaFiltro, propostaFiltro, busca]);

  useEffect(() => {
    setPagina(1);
  }, [busca, statusFiltro, analistaFiltro, propostaFiltro]);

  const totalPaginas = Math.max(1, Math.ceil(filtrados.length / porPagina));
  const itensPagina = filtrados.slice((pagina - 1) * porPagina, pagina * porPagina);

  const fmtMoeda = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const fmtData = (d) => (d ? parseDataLocal(d).toLocaleDateString("pt-BR") : "—");

  function toggleStatusChip(s) {
    setStatusFiltro((prev) => (prev.includes(s) ? prev.filter((x) => x !== s) : [...prev, s]));
  }

  return (
    <div className="space-y-4">
      {/* Chips rápidos por status (multi-seleção) */}
      <div className="flex flex-wrap items-center gap-2">
        <button
          onClick={() => setStatusFiltro([])}
          className="text-sm px-3.5 py-1.5 rounded-full transition-colors flex items-center gap-1.5"
          style={
            statusFiltro.length === 0
              ? { backgroundColor: BRAND_BLUE, color: "#fff", fontWeight: 600 }
              : { backgroundColor: "#fff", color: "#475569" }
          }
        >
          Todos
          <span className="text-xs opacity-70">{chamados.length}</span>
        </button>
        {statusDisponiveis.map((s) => {
          const selecionado = statusFiltro.includes(s);
          return (
            <button
              key={s}
              onClick={() => toggleStatusChip(s)}
              className="text-sm px-3.5 py-1.5 rounded-full transition-colors flex items-center gap-1.5"
              style={
                selecionado
                  ? { backgroundColor: BRAND_BLUE, color: "#fff", fontWeight: 600 }
                  : { backgroundColor: "#fff", color: "#475569" }
              }
            >
              {s}
              <span className="text-xs opacity-70">{contagemPorStatus[s] || 0}</span>
            </button>
          );
        })}
      </div>

      <div className="flex flex-wrap items-center gap-3 bg-white rounded-xl p-4 shadow-sm">
        <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-md px-3 py-2 flex-1 min-w-[220px]">
          <Search size={14} className="text-slate-400" />
          <input
            value={busca}
            onChange={(e) => setBusca(e.target.value)}
            placeholder="Buscar por nº, cliente ou descrição"
            className="bg-transparent text-sm outline-none w-full placeholder:text-slate-400"
          />
        </div>
        <MultiSelectFiltro
          label="Proposta"
          opcoes={propostaDisponiveis}
          selecionados={propostaFiltro}
          onChange={setPropostaFiltro}
        />
        <MultiSelectFiltro
          label="Analista"
          opcoes={analistasDisponiveis}
          selecionados={analistaFiltro}
          onChange={setAnalistaFiltro}
        />
        <span className="text-xs text-slate-400 ml-auto">
          {filtrados.length} chamados encontrados
          {statusFiltro.length === 0 && " · Encerrado e Cancelado ocultos por padrão"}
        </span>
      </div>

      <div className="bg-white rounded-xl shadow-sm overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-xs text-slate-400 border-b border-slate-100">
                <th className="px-4 py-3 font-medium">Nº</th>
                <th className="px-4 py-3 font-medium">Cliente</th>
                <th className="px-4 py-3 font-medium">Descrição</th>
                <th className="px-4 py-3 font-medium">Analista</th>
                <th className="px-4 py-3 font-medium">Abertura</th>
                <th className="px-4 py-3 font-medium">Status</th>
                <th className="px-4 py-3 font-medium">Proposta</th>
                <th className="px-4 py-3 font-medium text-right">Total Horas</th>
              </tr>
            </thead>
            <tbody>
              {itensPagina.map((c) => (
                <tr
                  key={c.id}
                  onClick={() => onEditar && onEditar(c)}
                  className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 cursor-pointer"
                >
                  <td className="px-4 py-2.5 font-mono text-xs text-slate-400">#{c.numero}</td>
                  <td className="px-4 py-2.5 text-slate-700 font-medium whitespace-nowrap">{c.cliente_nome}</td>
                  <td className="px-4 py-2.5 text-slate-500 max-w-[240px] truncate">{c.descricao || "—"}</td>
                  <td className="px-4 py-2.5 text-slate-500 whitespace-nowrap">{c.analista_nome || "—"}</td>
                  <td className="px-4 py-2.5 text-slate-500 whitespace-nowrap">{fmtData(c.data_abertura)}</td>
                  <td className="px-4 py-2.5">
                    <span
                      className="text-xs font-medium px-2 py-0.5 rounded-full whitespace-nowrap"
                      style={{ backgroundColor: corStatus(c.status) + "1a", color: corStatus(c.status) }}
                    >
                      {c.status}
                    </span>
                  </td>
                  <td className="px-4 py-2.5 text-slate-500 whitespace-nowrap">{c.proposta_status || "—"}</td>
                  <td className="px-4 py-2.5 text-right tabular-nums text-slate-600 whitespace-nowrap">
                    {Number(c.total_horas || 0).toLocaleString("pt-BR")}h
                  </td>
                </tr>
              ))}
              {itensPagina.length === 0 && (
                <tr>
                  <td colSpan={8} className="px-4 py-8 text-center text-slate-400 text-sm">
                    Nenhum chamado encontrado com esses filtros.
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        </div>

        <div className="flex items-center justify-between px-4 py-3 border-t border-slate-100 text-sm text-slate-500">
          <span>
            Página {pagina} de {totalPaginas}
          </span>
          <div className="flex gap-2">
            <button
              disabled={pagina <= 1}
              onClick={() => setPagina((p) => Math.max(1, p - 1))}
              className="px-3 py-1.5 rounded-md border border-slate-200 disabled:opacity-40"
            >
              Anterior
            </button>
            <button
              disabled={pagina >= totalPaginas}
              onClick={() => setPagina((p) => Math.min(totalPaginas, p + 1))}
              className="px-3 py-1.5 rounded-md border border-slate-200 disabled:opacity-40"
            >
              Próxima
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ChamadosDashboard() {
  const [ativo, setAtivo] = useState("visao-geral");
  const [menuMobileAberto, setMenuMobileAberto] = useState(false);
  const [modalAberto, setModalAberto] = useState(false);
  const [chamadoEmEdicao, setChamadoEmEdicao] = useState(null);
  const [configAberto, setConfigAberto] = useState(false);
  const [salvando, setSalvando] = useState(false);
  const [excluindo, setExcluindo] = useState(false);
  const [salvandoConfig, setSalvandoConfig] = useState(false);
  const [config, setConfig] = useState(CONFIG_PADRAO);
  const [configId, setConfigId] = useState(null);
  const [clienteFiltro, setClienteFiltro] = useState("Todos");
  const [chamadosData, setChamadosData] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [analistas, setAnalistas] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(null);
  const [statusOcultos, setStatusOcultos] = useState([]);

  async function carregarTudo() {
    setCarregando(true);
    setErro(null);
    try {
      const [chamadosRes, clientesRes, analistasRes, configRes, statusOcultosRes] = await Promise.all([
        sbFetch("/chamados_calculado?select=*&order=criado_em.desc&limit=1000"),
        sbFetch("/clientes?select=id,nome&order=nome.asc"),
        sbFetch("/analistas?select=id,nome,ativo&order=nome.asc"),
        sbFetch("/config_calculo?select=*&vigente_ate=is.null&limit=1"),
        sbFetch("/status_ocultos?select=status"),
      ]);
      setChamadosData(chamadosRes || []);
      setClientes(clientesRes || []);
      setAnalistas(analistasRes || []);
      setStatusOcultos((statusOcultosRes || []).map((s) => s.status));
      if (configRes && configRes[0]) {
        setConfig({
          pctQA: Number(configRes[0].pct_qa),
          pctGerencial: Number(configRes[0].pct_gerencial),
          valorHora: Number(configRes[0].valor_hora),
        });
        setConfigId(configRes[0].id);
      }
    } catch (e) {
      setErro(e.message);
    } finally {
      setCarregando(false);
    }
  }

  useEffect(() => { carregarTudo(); }, []);

  async function salvarChamado(registro) {
    setSalvando(true);
    try {
      const editando = !!registro.id;
      let cliente = clientes.find((c) => c.nome.toLowerCase() === registro.cliente.trim().toLowerCase());
      if (!cliente && !editando) {
        const criado = await sbFetch("/clientes", {
          method: "POST",
          body: JSON.stringify({ nome: registro.cliente.trim() }),
        });
        cliente = criado[0];
      }
      const analista = analistas.find((a) => a.nome === registro.analista);

      const payload = {
        numero: registro.numero,
        descricao: registro.descricao,
        status: registro.status,
        analista_id: analista ? analista.id : null,
        grupo_trabalho: registro.grupoTrabalho || null,
        complexidade: registro.complexidade || null,
        proposta_status: registro.propostaStatus || null,
        data_envio_proposta: registro.dataEnvioProposta,
        data_aprovacao: registro.dataAprovacao,
        horas_dev: registro.horasDev,
        pct_margem: registro.pctMargem,
        pct_negociado: registro.pctNegociado,
        qtd_parcelas: registro.qtdParcelas || 1,
        pct_qa_aplicado: registro.pctQaAplicado,
        pct_gerencial_aplicado: registro.pctGerencialAplicado,
        valor_hora_aplicado: registro.valorHoraAplicado,
      };

      if (editando) {
        await sbFetch(`/chamados?id=eq.${registro.id}`, { method: "PATCH", body: JSON.stringify(payload) });
      } else {
        await sbFetch("/chamados", {
          method: "POST",
          body: JSON.stringify({ ...payload, cliente_id: cliente.id }),
        });
      }
      setModalAberto(false);
      setChamadoEmEdicao(null);
      await carregarTudo();
    } catch (e) {
      alert("Não foi possível salvar o chamado: " + e.message);
    } finally {
      setSalvando(false);
    }
  }

  async function excluirChamado(id) {
    if (!confirm("Excluir este chamado? Essa ação não pode ser desfeita.")) return;
    setExcluindo(true);
    try {
      await sbFetch(`/chamados?id=eq.${id}`, { method: "DELETE" });
      setModalAberto(false);
      setChamadoEmEdicao(null);
      await carregarTudo();
    } catch (e) {
      alert("Não foi possível excluir o chamado: " + e.message);
    } finally {
      setExcluindo(false);
    }
  }

  async function salvarConfig(novaConfig) {
    setSalvandoConfig(true);
    try {
      const body = JSON.stringify({
        pct_qa: novaConfig.pctQA,
        pct_gerencial: novaConfig.pctGerencial,
        valor_hora: novaConfig.valorHora,
      });
      if (configId) {
        await sbFetch(`/config_calculo?id=eq.${configId}`, { method: "PATCH", body });
      } else {
        await sbFetch("/config_calculo", { method: "POST", body });
      }
      setConfigAberto(false);
      await carregarTudo();
    } catch (e) {
      alert("Não foi possível salvar a configuração: " + e.message);
    } finally {
      setSalvandoConfig(false);
    }
  }

  async function alternarAnalistaAtivo(analista) {
    const novoValor = !(analista.ativo !== false);
    setAnalistas((prev) => prev.map((a) => (a.id === analista.id ? { ...a, ativo: novoValor } : a)));
    try {
      await sbFetch(`/analistas?id=eq.${analista.id}`, {
        method: "PATCH",
        body: JSON.stringify({ ativo: novoValor }),
      });
    } catch (e) {
      setAnalistas((prev) => prev.map((a) => (a.id === analista.id ? { ...a, ativo: !novoValor } : a)));
      alert("Não foi possível atualizar o analista: " + e.message);
    }
  }

  async function criarAnalista(nome) {
    if (!nome) return;
    if (analistas.some((a) => a.nome.toLowerCase() === nome.toLowerCase())) {
      alert("Já existe um analista com esse nome.");
      return;
    }
    try {
      const criado = await sbFetch("/analistas", {
        method: "POST",
        body: JSON.stringify({ nome, ativo: true }),
      });
      if (criado && criado[0]) setAnalistas((prev) => [...prev, criado[0]].sort((a, b) => a.nome.localeCompare(b.nome)));
    } catch (e) {
      alert("Não foi possível cadastrar o analista: " + e.message);
    }
  }

  async function alternarStatusOculto(status) {
    const estaOculto = statusOcultos.includes(status);
    setStatusOcultos((prev) => (estaOculto ? prev.filter((s) => s !== status) : [...prev, status]));
    try {
      if (estaOculto) {
        await sbFetch(`/status_ocultos?status=eq.${encodeURIComponent(status)}`, { method: "DELETE" });
      } else {
        await sbFetch("/status_ocultos", { method: "POST", body: JSON.stringify({ status }) });
      }
    } catch (e) {
      setStatusOcultos((prev) => (estaOculto ? [...prev, status] : prev.filter((s) => s !== status)));
      alert("Não foi possível atualizar a visibilidade do status: " + e.message);
    }
  }

  const chamadosVisiveis = useMemo(
    () => chamadosData.filter((c) => !statusOcultos.includes(c.status)),
    [chamadosData, statusOcultos]
  );

  const chamadosFiltrados = useMemo(
    () =>
      clienteFiltro === "Todos"
        ? chamadosVisiveis
        : chamadosVisiveis.filter((c) => c.cliente_nome === clienteFiltro),
    [chamadosVisiveis, clienteFiltro]
  );

  const kpis = useMemo(() => {
    const total = chamadosFiltrados.length;
    const totalHoras = chamadosFiltrados.reduce((s, c) => s + Number(c.total_horas || 0), 0);
    const totalValor = chamadosFiltrados.reduce((s, c) => s + Number(c.valor_total_projeto || 0), 0);
    const concluidos = chamadosFiltrados.filter((c) => c.status === "Concluido").length;
    const encerrados = chamadosFiltrados.filter((c) => c.status === "Encerrado").length;
    return { total, totalHoras, totalValor, concluidos, encerrados };
  }, [chamadosFiltrados]);

  const volumeMensal = useMemo(() => {
    const nomesMes = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    const anoFoco = new Date().getFullYear();
    const contagem = Array(12).fill(0);
    chamadosFiltrados.forEach((c) => {
      if (!c.data_abertura) return;
      const d = parseDataLocal(c.data_abertura);
      if (d.getFullYear() === anoFoco) contagem[d.getMonth()]++;
    });
    let ultimoMes = 0;
    contagem.forEach((v, i) => { if (v > 0) ultimoMes = i; });
    return nomesMes.slice(0, ultimoMes + 1).map((mes, i) => ({ mes, chamados: contagem[i] }));
  }, [chamadosFiltrados]);

  const statusDistribuicao = useMemo(() => {
    const contagem = {};
    chamadosFiltrados.forEach((c) => {
      const s = c.status || "Sem status";
      contagem[s] = (contagem[s] || 0) + 1;
    });
    return Object.entries(contagem).sort((a, b) => b[1] - a[1]).map(([nome, valor]) => ({ nome, valor, cor: corStatus(nome) }));
  }, [chamadosFiltrados]);

  const analistasCarga = useMemo(() => {
    const contagem = {};
    chamadosFiltrados.forEach((c) => {
      const nome = c.analista_nome || "Sem analista";
      contagem[nome] = (contagem[nome] || 0) + 1;
    });
    return Object.entries(contagem).sort((a, b) => b[1] - a[1]).map(([nome, chamados]) => ({ nome, chamados }));
  }, [chamadosFiltrados]);

  const topClientes = useMemo(() => {
    const anoFoco = new Date().getFullYear();
    const contagem = {};
    chamadosVisiveis.forEach((c) => {
      if (!c.data_abertura) return;
      if (parseDataLocal(c.data_abertura).getFullYear() !== anoFoco) return;
      contagem[c.cliente_nome] = (contagem[c.cliente_nome] || 0) + 1;
    });
    return Object.entries(contagem).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([nome, chamados]) => ({ nome, chamados }));
  }, [chamadosVisiveis]);

  const totalBacklog = useMemo(() => chamadosData.filter((c) => c.status === "BackLog").length, [chamadosData]);

  return (
    <div className="flex h-screen w-full bg-[#F5F6F4] text-slate-800 overflow-hidden" style={{ fontFamily: "'Inter', sans-serif" }}>
      {menuMobileAberto && (
        <div className="fixed inset-0 bg-black/40 z-30 md:hidden" onClick={() => setMenuMobileAberto(false)} />
      )}
      <aside
        className={`w-64 shrink-0 bg-[#1F3F66] text-slate-200 flex flex-col fixed md:static inset-y-0 left-0 z-40 transition-transform duration-200 ${
          menuMobileAberto ? "translate-x-0" : "-translate-x-full"
        } md:translate-x-0`}
      >
        <div className="px-5 py-4 border-b border-white/10">
          <a href="/" className="flex items-center gap-1 text-xs text-slate-400 hover:text-white mb-3 transition-colors">
            <ChevronRight size={12} className="rotate-180" />
            Voltar para Projetos
          </a>
          <Wordmark size={20} variant="light" />
          <div className="text-[11px] font-semibold tracking-[0.15em] text-slate-400 uppercase mt-3">Painel de Chamados</div>
        </div>
        <nav className="flex-1 overflow-y-auto py-3 px-3">
          {navSecoes(kpis.total, totalBacklog).map((secao) => (
            <div key={secao.titulo} className="mb-4">
              <div className="text-[10px] font-mono tracking-widest text-slate-500 px-2 mb-1.5">{secao.titulo}</div>
              {secao.itens.map((item) => {
                const IconComp = item.icon;
                const selecionado = ativo === item.id;
                return (
                  <button key={item.id} onClick={() => { if (item.id === "config") setConfigAberto(true); else setAtivo(item.id); setMenuMobileAberto(false); }}
                    className="w-full flex items-center justify-between gap-2 px-3 py-2 rounded-lg text-sm mb-0.5 font-medium transition-colors"
                    style={selecionado ? { backgroundColor: "rgba(226,0,26,0.14)", color: "#FF9FAE" } : { color: "#94a3b8" }}>
                    <span className="flex items-center gap-2.5"><IconComp size={15} />{item.label}</span>
                    {item.badge && (
                      <span className="text-[10px] font-mono min-w-[20px] text-center rounded-full px-1.5 py-0.5"
                        style={selecionado ? { backgroundColor: BRAND_RED, color: "#fff", fontWeight: 700 } : { color: "#64748b" }}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          ))}
        </nav>
        <div className="px-5 py-2.5 border-t border-white/10 text-[11px] text-slate-500">Dados migrados de 34 abas → 1 base única</div>
      </aside>

      <main className="flex-1 overflow-y-auto w-full min-w-0">
        <header className="flex items-center justify-between gap-3 px-4 md:px-8 py-5 md:py-7 bg-[#F5F6F4]">
          <div className="flex items-center gap-3 min-w-0">
            <button
              onClick={() => setMenuMobileAberto(true)}
              className="md:hidden shrink-0 text-slate-600 p-1.5 -ml-1.5 rounded-md hover:bg-slate-200"
              aria-label="Abrir menu"
            >
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <path d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <div className="min-w-0">
              <h1
                className="text-xl md:text-[28px] font-extrabold text-slate-900 leading-tight truncate"
                style={{ fontFamily: "'Poppins', sans-serif" }}
              >
                {ativo === "chamados" ? "Chamados" : ativo === "backlog" ? "Backlog por Cliente" : ativo === "analistas" ? "Carga por Analista" : ativo === "propostas" ? "Propostas Enviadas" : ativo === "aprovadas" ? "Aprovadas por Mês" : ativo === "financeiro" ? "Valores & Margem" : "Visão Geral"}
              </h1>
              <p className="text-xs md:text-sm text-slate-500 mt-1 hidden sm:block truncate">
                {ativo === "chamados" ? "Lista completa de chamados, com busca e filtros" : ativo === "backlog" ? "Chamados parados em BackLog, agrupados por cliente" : ativo === "analistas" ? "Distribuição de chamados por analista responsável" : ativo === "propostas" ? "Chamados concluídos com proposta enviada aguardando retorno" : ativo === "aprovadas" ? "Propostas aprovadas, mês a mês" : ativo === "financeiro" ? "Valores de projeto, descontos e margem" : "Visão consolidada dos chamados, prazos e status por cliente"}
              </p>
            </div>
          </div>
          <button
            onClick={() => { setChamadoEmEdicao(null); setModalAberto(true); }}
            className="shrink-0 flex items-center gap-1.5 text-sm font-medium text-white px-3 md:px-4 py-2 md:py-2.5 rounded-lg"
            style={{ backgroundColor: BRAND_BLUE }}
          >
            <Plus size={15} />
            <span className="hidden sm:inline">Novo Chamado</span>
          </button>
        </header>

        {erro && (
          <div className="mx-8 mt-4 bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg">
            Não foi possível carregar os dados do Supabase: {erro}
          </div>
        )}
        {carregando && !erro && (
          <div className="mx-8 mt-4 text-sm text-slate-400">Carregando dados do banco...</div>
        )}

        <div className="p-4 md:p-8 space-y-6">
          {ativo === "chamados" ? (
            <ChamadosListaPage chamados={chamadosData} analistas={analistas} onEditar={(c) => { setChamadoEmEdicao(c); setModalAberto(true); }} />
          ) : ativo === "backlog" ? (
            <BacklogPorClientePage chamados={chamadosData} onEditar={(c) => { setChamadoEmEdicao(c); setModalAberto(true); }} />
          ) : ativo === "analistas" ? (
            <CargaPorAnalistaPage chamados={chamadosData} analistas={analistas} onEditar={(c) => { setChamadoEmEdicao(c); setModalAberto(true); }} />
          ) : ativo === "propostas" ? (
            <PropostasEnviadasPage chamados={chamadosData} onEditar={(c) => { setChamadoEmEdicao(c); setModalAberto(true); }} />
          ) : ativo === "aprovadas" ? (
            <AprovadasPorMesPage chamados={chamadosData} onEditar={(c) => { setChamadoEmEdicao(c); setModalAberto(true); }} />
          ) : ativo === "financeiro" ? (
            <ValoresMargemPage chamados={chamadosData} onEditar={(c) => { setChamadoEmEdicao(c); setModalAberto(true); }} />
          ) : (
            <>
          <div className="flex flex-wrap gap-4">
            <KpiCard label="Total de Chamados" value={kpis.total} accent="#0F172A" />
            <KpiCard label="Horas Totais" value={`${Math.round(kpis.totalHoras).toLocaleString("pt-BR")}h`} accent="#3A6EA5" />
            <KpiCard label="Valor Total" value={formatMoeda(kpis.totalValor)} accent="#0F8A6B" />
            <KpiCard label="Taxa de Conclusão" value={kpis.total ? `${Math.round(((kpis.concluidos + kpis.encerrados) / kpis.total) * 100)}%` : "—"} sub={`${kpis.concluidos + kpis.encerrados} de ${kpis.total}`} accent="#7C3AED" />
          </div>

          <div className="flex flex-wrap items-center gap-2">
            <span className="text-sm text-slate-500 mr-1">Cliente:</span>
            {["Todos", ...topClientes.map((c) => c.nome)].map((nome) => {
              const selecionado = clienteFiltro === nome;
              return (
                <button key={nome} onClick={() => setClienteFiltro(nome)} className="text-sm px-3.5 py-1.5 rounded-full transition-colors"
                  style={selecionado ? { backgroundColor: BRAND_BLUE, color: "#fff", fontWeight: 600 } : { backgroundColor: "#fff", color: "#475569" }}>
                  {nome}
                </button>
              );
            })}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div className="lg:col-span-2 bg-white border border-slate-200 rounded-lg p-5">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-sm font-semibold text-slate-800" style={{fontFamily:"'Poppins', sans-serif"}}>Volume de Chamados · {new Date().getFullYear()}</h2>
                <ChevronRight size={16} className="text-slate-300" />
              </div>
              <ResponsiveContainer width="100%" height={220}>
                <LineChart data={volumeMensal}>
                  <CartesianGrid stroke="#EEF0EC" vertical={false} />
                  <XAxis dataKey="mes" tick={{ fontSize: 12, fill: "#94a3b8" }} axisLine={false} tickLine={false} />
                  <YAxis tick={{ fontSize: 12, fill: "#94a3b8" }} axisLine={false} tickLine={false} />
                  <Tooltip />
                  <Line type="monotone" dataKey="chamados" stroke={BRAND_BLUE} strokeWidth={2.5} dot={{ r: 3 }} />
                </LineChart>
              </ResponsiveContainer>
            </div>

            <div className="bg-white border border-slate-200 rounded-lg p-5">
              <h2 className="text-sm font-semibold text-slate-800 mb-4" style={{fontFamily:"'Poppins', sans-serif"}}>Status (histórico)</h2>
              <ResponsiveContainer width="100%" height={180}>
                <PieChart>
                  <Pie data={statusDistribuicao} dataKey="valor" nameKey="nome" innerRadius={45} outerRadius={70} paddingAngle={2}>
                    {statusDistribuicao.map((s) => <Cell key={s.nome} fill={s.cor} />)}
                  </Pie>
                  <Tooltip />
                </PieChart>
              </ResponsiveContainer>
              <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 mt-2">
                {statusDistribuicao.map((s) => (
                  <div key={s.nome} className="flex items-center gap-1.5 text-[11px] text-slate-500">
                    <CircleDot fill={s.cor} size={7} />{s.nome}
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div className="bg-white border border-slate-200 rounded-lg p-5">
              <h2 className="text-sm font-semibold text-slate-800 mb-3" style={{fontFamily:"'Poppins', sans-serif"}}>Carga por Analista</h2>
              <ResponsiveContainer width="100%" height={200}>
                <BarChart data={analistasCarga} layout="vertical" margin={{ left: 10 }}>
                  <XAxis type="number" hide />
                  <YAxis dataKey="nome" type="category" width={70} tick={{ fontSize: 12, fill: "#475569" }} axisLine={false} tickLine={false} />
                  <Tooltip />
                  <Bar dataKey="chamados" fill="#3A6EA5" radius={[0, 4, 4, 0]} />
                </BarChart>
              </ResponsiveContainer>
            </div>

            <div className="bg-white border border-slate-200 rounded-lg p-5">
              <h2 className="text-sm font-semibold text-slate-800 mb-3" style={{fontFamily:"'Poppins', sans-serif"}}>Top Clientes · {new Date().getFullYear()}</h2>
              <ResponsiveContainer width="100%" height={200}>
                <BarChart data={topClientes.slice(0, 6)} layout="vertical" margin={{ left: 10 }}>
                  <XAxis type="number" hide />
                  <YAxis dataKey="nome" type="category" width={80} tick={{ fontSize: 11, fill: "#475569" }} axisLine={false} tickLine={false} />
                  <Tooltip />
                  <Bar dataKey="chamados" fill="#E0A526" radius={[0, 4, 4, 0]} />
                </BarChart>
              </ResponsiveContainer>
            </div>

            <div className="bg-white border border-slate-200 rounded-lg p-5">
              <div className="flex items-center justify-between mb-1">
                <h2 className="text-sm font-semibold text-slate-800" style={{fontFamily:"'Poppins', sans-serif"}}>Últimos Chamados</h2>
              </div>
              <div>
                {chamadosFiltrados.slice(0, 6).map((c) => (
                  <TicketRow key={c.id} n={c.numero} cliente={`${c.cliente_nome} · ${c.descricao || "sem descrição"}`} status={c.status} statusColor={corStatus(c.status)} />
                ))}
              </div>
            </div>
          </div>
            </>
          )}
        </div>
      </main>

      <ChamadoFormModal
        aberto={modalAberto}
        onFechar={() => { setModalAberto(false); setChamadoEmEdicao(null); }}
        onSalvar={salvarChamado}
        salvando={salvando}
        onExcluir={excluirChamado}
        excluindo={excluindo}
        config={config}
        analistas={analistas}
        chamadoExistente={chamadoEmEdicao}
      />
      <ConfiguracoesModal aberto={configAberto} onFechar={() => setConfigAberto(false)} config={config} onSalvar={salvarConfig} salvando={salvandoConfig} analistas={analistas} onToggleAnalista={alternarAnalistaAtivo} onNovoAnalista={criarAnalista} statusOcultos={statusOcultos} onToggleStatus={alternarStatusOculto} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ChamadosDashboard />);
</script>

<script>
  // Transforma o JSX manualmente, forçando o runtime "clássico" (React.createElement),
  // já que o runtime "automático" padrão do Babel gera um `import` que quebra fora de um bundler.
  var codigoFonte = document.getElementById("app-source").textContent;
  var codigoTransformado = Babel.transform(codigoFonte, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  var scriptFinal = document.createElement("script");
  scriptFinal.textContent = codigoTransformado;
  document.body.appendChild(scriptFinal);
</script>
</body>
</html>
