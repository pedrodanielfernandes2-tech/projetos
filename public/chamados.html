function ChamadosListaPage({ chamados, analistas, onEditar }) {
  const VAZIA = "(Vazia)";
  const [busca, setBusca] = useState("");
  const [statusFiltro, setStatusFiltro] = useState([]);
  const [analistaFiltro, setAnalistaFiltro] = useState(["Pedro", "Luciane", "Evandro", "Débora"]);
  const [propostaFiltro, setPropostaFiltro] = useState(["Enviado", VAZIA]);
  const [pagina, setPagina] = useState(1);
  const porPagina = 25;

  const statusDisponiveis = useMemo(
    () => [...new Set(chamados.map((c) => c.status).filter(Boolean))],
    [chamados]
  );

  const propostaDisponiveis = useMemo(
    () => [...new Set(chamados.map((c) => c.proposta_status || VAZIA))],
    [chamados]
  );

  const analistasDisponiveis = useMemo(() => analistas.map((a) => a.nome), [analistas]);

  const contagemPorStatus = useMemo(() => {
    const c = {};
    chamados.forEach((ch) => {
      c[ch.status] = (c[ch.status] || 0) + 1;
    });
    return c;
  }, [chamados]);

  const STATUS_OCULTOS_PADRAO = ["Encerrado", "Cancelado"];

  const filtrados = useMemo(() => {
    return chamados.filter((c) => {
      if (statusFiltro.length > 0) {
        if (!statusFiltro.includes(c.status)) return false;
      } else if (STATUS_OCULTOS_PADRAO.includes(c.status)) {
        // sem nenhum status escolhido manualmente, esconde Encerrado/Cancelado
        // por padrão (quem quiser vê-los, seleciona o chip do status direto)
        return false;
      }
      if (analistaFiltro.length > 0 && !analistaFiltro.includes(c.analista_nome)) return false;
      if (propostaFiltro.length > 0 && !propostaFiltro.includes(c.proposta_status || VAZIA)) return false;
      if (busca.trim()) {
        const alvo = `${c.numero} ${c.cliente_nome} ${c.descricao || ""}`.toLowerCase();
        if (!alvo.includes(busca.trim().toLowerCase())) return false;
      }
      return true;
    });
  }, [chamados, statusFiltro, analistaFiltro, propostaFiltro, busca]);

  useEffect(() => {
    setPagina(1);
  }, [busca, statusFiltro, analistaFiltro, propostaFiltro]);

  const totalPaginas = Math.max(1, Math.ceil(filtrados.length / porPagina));
  const itensPagina = filtrados.slice((pagina - 1) * porPagina, pagina * porPagina);

  const fmtMoeda = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const fmtData = (d) => (d ? parseDataLocal(d).toLocaleDateString("pt-BR") : "—");

  function toggleStatusChip(s) {
    setStatusFiltro((prev) => (prev.includes(s) ? prev.filter((x) => x !== s) : [...prev, s]));
  }

  return (
    <div className="space-y-4">
      {/* Chips rápidos por status (multi-seleção) */}
      <div className="flex flex-wrap items-center gap-2">
        <button
          onClick={() => setStatusFiltro([])}
          className="text-sm px-3.5 py-1.5 rounded-full transition-colors flex items-center gap-1.5"
          style={
            statusFiltro.length === 0
              ? { backgroundColor: BRAND_BLUE, color: "#fff", fontWeight: 600 }
              : { backgroundColor: "#fff", color: "#475569" }
          }
        >
          Todos
          <span className="text-xs opacity-70">{chamados.length}</span>
        </button>
        {statusDisponiveis.map((s) => {
          const selecionado = statusFiltro.includes(s);
          return (
            <button
              key={s}
              onClick={() => toggleStatusChip(s)}
              className="text-sm px-3.5 py-1.5 rounded-full transition-colors flex items-center gap-1.5"
              style={
                selecionado
                  ? { backgroundColor: BRAND_BLUE, color: "#fff", fontWeight: 600 }
                  : { backgroundColor: "#fff", color: "#475569" }
              }
            >
              {s}
              <span className="text-xs opacity-70">{contagemPorStatus[s] || 0}</span>
            </button>
          );
        })}
      </div>

      <div className="flex flex-wrap items-center gap-3 bg-white rounded-xl p-4 shadow-sm">
        <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-md px-3 py-2 flex-1 min-w-[220px]">
          <Search size={14} className="text-slate-400" />
          <input
            value={busca}
            onChange={(e) => setBusca(e.target.value)}
            placeholder="Buscar por nº, cliente ou descrição"
            className="bg-transparent text-sm outline-none w-full placeholder:text-slate-400"
          />
        </div>
        <MultiSelectFiltro
          label="Proposta"
          opcoes={propostaDisponiveis}
          selecionados={propostaFiltro}
          onChange={setPropostaFiltro}
        />
        <MultiSelectFiltro
          label="Analista"
          opcoes={analistasDisponiveis}
          selecionados={analistaFiltro}
          onChange={setAnalistaFiltro}
        />
        <span className="text-xs text-slate-400 ml-auto">
          {filtrados.length} chamados encontrados
          {statusFiltro.length === 0 && " · Encerrado e Cancelado ocultos por padrão"}
        </span>
      </div>

      <div className="bg-white rounded-xl shadow-sm overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-xs text-slate-400 border-b border-slate-100">
                <th className="px-4 py-3 font-medium">Nº</th>
                <th className="px-4 py-3 font-medium">Cliente</th>
                <th className="px-4 py-3 font-medium">Descrição</th>
                <th className="px-4 py-3 font-medium">Analista</th>
                <th className="px-4 py-3 font-medium">Abertura</th>
                <th className="px-4 py-3 font-medium">Status</th>
                <th className="px-4 py-3 font-medium">Proposta</th>
                <th className="px-4 py-3 font-medium text-right">Total Geral</th>
              </tr>
            </thead>
            <tbody>
              {itensPagina.map((c) => (
                <tr
                  key={c.id}
                  onClick={() => onEditar && onEditar(c)}
                  className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 cursor-pointer"
                >
                  <td className="px-4 py-2.5 font-mono text-xs text-slate-400">#{c.numero}</td>
                  <td className="px-4 py-2.5 text-slate-700 font-medium whitespace-nowrap">{c.cliente_nome}</td>
                  <td className="px-4 py-2.5 text-slate-500 max-w-[340px] truncate" title={c.descricao || ""}>{c.descricao || "—"}</td>
                  <td className="px-4 py-2.5 text-slate-500 whitespace-nowrap">{c.analista_nome || "—"}</td>
                  <td className="px-4 py-2.5 text-slate-500 whitespace-nowrap">{fmtData(c.data_abertura)}</td>
                  <td className="px-4 py-2.5">
                    <span
                      className="text-xs font-medium px-2 py-0.5 rounded-full whitespace-nowrap"
                      style={{ backgroundColor: corStatus(c.status) + "1a", color: corStatus(c.status) }}
                    >
                      {c.status}
                    </span>
                  </td>
                  <td className="px-4 py-2.5 text-slate-500 whitespace-nowrap">{c.proposta_status || "—"}</td>
                  <td className="px-4 py-2.5 text-right tabular-nums text-slate-600 whitespace-nowrap">
                    {Number(c.total_geral || 0).toLocaleString("pt-BR")}h
                  </td>
                </tr>
              ))}
              {itensPagina.length === 0 && (
                <tr>
                  <td colSpan={8} className="px-4 py-8 text-center text-slate-400 text-sm">
                    Nenhum chamado encontrado com esses filtros.
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        </div>

        <div className="flex items-center justify-between px-4 py-3 border-t border-slate-100 text-sm text-slate-500">
          <span>
            Página {pagina} de {totalPaginas}
          </span>
          <div className="flex gap-2">
            <button
              disabled={pagina <= 1}
              onClick={() => setPagina((p) => Math.max(1, p - 1))}
              className="px-3 py-1.5 rounded-md border border-slate-200 disabled:opacity-40"
            >
              Anterior
            </button>
            <button
              disabled={pagina >= totalPaginas}
              onClick={() => setPagina((p) => Math.min(totalPaginas, p + 1))}
              className="px-3 py-1.5 rounded-md border border-slate-200 disabled:opacity-40"
            >
              Próxima
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ChamadosDashboard() {
  const [ativo, setAtivo] = useState("visao-geral");
  const [menuMobileAberto, setMenuMobileAberto] = useState(false);
  const [menuColapsado, setMenuColapsado] = useState(() => {
    try { return localStorage.getItem("chamadosMenuColapsado") === "true"; } catch (e) { return false; }
  });
  const [modalAberto, setModalAberto] = useState(false);
  const [exportandoPdf, setExportandoPdf] = useState(false);
  const [chamadoEmEdicao, setChamadoEmEdicao] = useState(null);
  const [configAberto, setConfigAberto] = useState(false);
  const [salvando, setSalvando] = useState(false);
  const [excluindo, setExcluindo] = useState(false);
  const [salvandoConfig, setSalvandoConfig] = useState(false);
  const [config, setConfig] = useState(CONFIG_PADRAO);
  const [configId, setConfigId] = useState(null);
  const [clienteFiltro, setClienteFiltro] = useState("Todos");
  const [chamadosData, setChamadosData] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [analistas, setAnalistas] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(null);
  const [statusOcultos, setStatusOcultos] = useState([]);
  const [modelosParcelamento, setModelosParcelamento] = useState([]);
  const [tabelasRecurso, setTabelasRecurso] = useState([]);

  async function carregarTudo() {
    setCarregando(true);
    setErro(null);
    try {
      const [chamadosRes, clientesRes, analistasRes, configRes, statusOcultosRes, modelosRes, tabelasRecursoRes] = await Promise.all([
        sbFetch("/chamados_calculado?select=*&order=criado_em.desc&limit=1000"),
        sbFetch("/clientes?select=id,nome&order=nome.asc"),
        sbFetch("/analistas?select=id,nome,ativo&order=nome.asc"),
        sbFetch("/config_calculo?select=*&vigente_ate=is.null&limit=1"),
        sbFetch("/status_ocultos?select=status"),
        sbFetch("/modelos_parcelamento"),
        sbFetch("/tabelas_recurso"),
      ]);
      setChamadosData(chamadosRes || []);
      setClientes(clientesRes || []);
      setAnalistas(analistasRes || []);
      setStatusOcultos((statusOcultosRes || []).map((s) => s.status));
      setModelosParcelamento(modelosRes || []);
      setTabelasRecurso(tabelasRecursoRes || []);
      if (configRes && configRes[0]) {
        setConfig({
          pctQA: Number(configRes[0].pct_qa),
          pctGerencial: Number(configRes[0].pct_gerencial),
          valorHora: Number(configRes[0].valor_hora),
        });
        setConfigId(configRes[0].id);
      }
    } catch (e) {
      setErro(e.message);
    } finally {
      setCarregando(false);
    }
  }

  useEffect(() => { carregarTudo(); }, []);

  async function exportarVisaoGeralPdf() {
    const elemento = document.getElementById("visao-geral-export-area");
    if (!elemento) return;
    setExportandoPdf(true);
    try {
      const canvas = await html2canvas(elemento, { scale: 2, backgroundColor: "#f8fafc", useCORS: true });
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF("p", "mm", "a4");
      const larguraPagina = pdf.internal.pageSize.getWidth();
      const alturaPagina = pdf.internal.pageSize.getHeight();
      const margem = 10;
      const larguraUtil = larguraPagina - margem * 2;
      const escalaPxParaMm = larguraUtil / canvas.width;
      const alturaPaginaEmPx = (alturaPagina - margem * 2) / escalaPxParaMm;

      // Fatia o canvas inteiro (que pode ser bem alto) em pedacos do tamanho de uma
      // pagina A4, adicionando cada pedaco como uma pagina nova do PDF.
      let offsetY = 0;
      let pagina = 0;
      while (offsetY < canvas.height) {
        const alturaFatia = Math.min(alturaPaginaEmPx, canvas.height - offsetY);
        const canvasFatia = document.createElement("canvas");
        canvasFatia.width = canvas.width;
        canvasFatia.height = alturaFatia;
        const ctx = canvasFatia.getContext("2d");
        ctx.drawImage(canvas, 0, offsetY, canvas.width, alturaFatia, 0, 0, canvas.width, alturaFatia);
        const imgData = canvasFatia.toDataURL("image/png");
        if (pagina > 0) pdf.addPage();
        pdf.addImage(imgData, "PNG", margem, margem, larguraUtil, alturaFatia * escalaPxParaMm);
        offsetY += alturaFatia;
        pagina++;
      }

      pdf.save(`visao-geral-chamados-${new Date().toISOString().slice(0, 10)}.pdf`);
    } catch (e) {
      alert("Não foi possível gerar o PDF: " + e.message);
    } finally {
      setExportandoPdf(false);
    }
  }

  async function salvarChamado(registro) {
    setSalvando(true);
    try {
      const editando = !!registro.id;
      let cliente = clientes.find((c) => c.nome.toLowerCase() === registro.cliente.trim().toLowerCase());
      if (!cliente && !editando) {
        const criado = await sbFetch("/clientes", {
          method: "POST",
          body: JSON.stringify({ nome: registro.cliente.trim() }),
        });
        cliente = criado[0];
      }
      const analista = analistas.find((a) => a.nome === registro.analista);

      const payload = {
        numero: registro.numero,
        descricao: registro.descricao,
        status: registro.status,
        analista_id: analista ? analista.id : null,
        grupo_trabalho: registro.grupoTrabalho || null,
        complexidade: registro.complexidade || null,
        proposta_status: registro.propostaStatus || null,
        data_envio_proposta: registro.dataEnvioProposta,
        data_aprovacao: registro.dataAprovacao,
        horas_dev: registro.horasDev,
        pct_margem: registro.pctMargem,
        pct_negociado: registro.pctNegociado,
        modelo_parcelamento_id: registro.modeloParcelamentoId || null,
        pct_qa_aplicado: registro.pctQaAplicado,
        pct_gerencial_aplicado: registro.pctGerencialAplicado,
        valor_hora_aplicado: registro.valorHoraAplicado,
        modo_precificacao: registro.modoPrecificacao || "unico",
        tabela_recurso_id: registro.tabelaRecursoId || null,
        recursos_horas: registro.recursosHoras || null,
        valor_fixo: registro.valorFixo || 0,
        total_geral_manual: registro.totalGeralManual === "" || registro.totalGeralManual === undefined ? null : registro.totalGeralManual,
      };

      if (editando) {
        await sbFetch(`/chamados?id=eq.${registro.id}`, { method: "PATCH", body: JSON.stringify(payload) });
      } else {
        await sbFetch("/chamados", {
          method: "POST",
          body: JSON.stringify({ ...payload, cliente_id: cliente.id }),
        });
      }
      setModalAberto(false);
      setChamadoEmEdicao(null);
      await carregarTudo();
    } catch (e) {
      alert("Não foi possível salvar o chamado: " + e.message);
    } finally {
      setSalvando(false);
    }
  }

  async function excluirChamado(id) {
    if (!confirm("Excluir este chamado? Essa ação não pode ser desfeita.")) return;
    setExcluindo(true);
    try {
      await sbFetch(`/chamados?id=eq.${id}`, { method: "DELETE" });
      setModalAberto(false);
      setChamadoEmEdicao(null);
      await carregarTudo();
    } catch (e) {
      alert("Não foi possível excluir o chamado: " + e.message);
    } finally {
      setExcluindo(false);
    }
  }

  async function salvarConfig(novaConfig) {
    setSalvandoConfig(true);
    try {
      const body = JSON.stringify({
        pct_qa: novaConfig.pctQA,
        pct_gerencial: novaConfig.pctGerencial,
        valor_hora: novaConfig.valorHora,
      });
      if (configId) {
        await sbFetch(`/config_calculo?id=eq.${configId}`, { method: "PATCH", body });
      } else {
        await sbFetch("/config_calculo", { method: "POST", body });
      }
      setConfigAberto(false);
      await carregarTudo();
    } catch (e) {
      alert("Não foi possível salvar a configuração: " + e.message);
    } finally {
      setSalvandoConfig(false);
    }
  }

  async function alternarAnalistaAtivo(analista) {
    const novoValor = !(analista.ativo !== false);
    setAnalistas((prev) => prev.map((a) => (a.id === analista.id ? { ...a, ativo: novoValor } : a)));
    try {
      await sbFetch(`/analistas?id=eq.${analista.id}`, {
        method: "PATCH",
        body: JSON.stringify({ ativo: novoValor }),
      });
    } catch (e) {
      setAnalistas((prev) => prev.map((a) => (a.id === analista.id ? { ...a, ativo: !novoValor } : a)));
      alert("Não foi possível atualizar o analista: " + e.message);
    }
  }

  async function criarAnalista(nome) {
    if (!nome) return;
    if (analistas.some((a) => a.nome.toLowerCase() === nome.toLowerCase())) {
      alert("Já existe um analista com esse nome.");
      return;
    }
    try {
      const criado = await sbFetch("/analistas", {
        method: "POST",
        body: JSON.stringify({ nome, ativo: true }),
      });
      if (criado && criado[0]) setAnalistas((prev) => [...prev, criado[0]].sort((a, b) => a.nome.localeCompare(b.nome)));
    } catch (e) {
      alert("Não foi possível cadastrar o analista: " + e.message);
    }
  }

  async function criarModeloParcelamento(nome, parcelas) {
    try {
      const criado = await sbFetch("/modelos_parcelamento", {
        method: "POST",
        body: JSON.stringify({ nome, parcelas }),
      });
      if (criado && criado[0]) setModelosParcelamento((prev) => [...prev, criado[0]].sort((a, b) => a.nome.localeCompare(b.nome)));
      return true;
    } catch (e) {
      alert("Não foi possível criar o modelo: " + e.message);
      return false;
    }
  }
  async function atualizarModeloParcelamento(id, dados) {
    try {
      await sbFetch(`/modelos_parcelamento?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(dados) });
      await carregarTudo();
      return true;
    } catch (e) {
      alert("Não foi possível atualizar o modelo: " + e.message);
      return false;
    }
  }
  async function excluirModeloParcelamento(id) {
    if (!confirm("Excluir esse modelo de parcelamento?")) return;
    try {
      await sbFetch(`/modelos_parcelamento?id=eq.${id}`, { method: "DELETE" });
      setModelosParcelamento((prev) => prev.filter((m) => m.id !== id));
    } catch (e) {
      alert("Não foi possível excluir o modelo: " + e.message);
    }
  }

  async function criarTabelaRecurso(nome, papeis) {
    try {
      const criado = await sbFetch("/tabelas_recurso", {
        method: "POST",
        body: JSON.stringify({ nome, papeis }),
      });
      if (criado && criado[0]) setTabelasRecurso((prev) => [...prev, criado[0]].sort((a, b) => a.nome.localeCompare(b.nome)));
      return true;
    } catch (e) {
      alert("Não foi possível criar a tabela de recursos: " + e.message);
      return false;
    }
  }
  async function atualizarTabelaRecurso(id, dados) {
    try {
      await sbFetch(`/tabelas_recurso?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(dados) });
      await carregarTudo();
      return true;
    } catch (e) {
      alert("Não foi possível atualizar a tabela de recursos: " + e.message);
      return false;
    }
  }
  async function excluirTabelaRecurso(id) {
    if (!confirm("Excluir essa tabela de recursos?")) return;
    try {
      await sbFetch(`/tabelas_recurso?id=eq.${id}`, { method: "DELETE" });
      setTabelasRecurso((prev) => prev.filter((t) => t.id !== id));
    } catch (e) {
      alert("Não foi possível excluir a tabela de recursos: " + e.message);
    }
  }

  async function alternarStatusOculto(status) {
    const estaOculto = statusOcultos.includes(status);
    setStatusOcultos((prev) => (estaOculto ? prev.filter((s) => s !== status) : [...prev, status]));
    try {
      if (estaOculto) {
        await sbFetch(`/status_ocultos?status=eq.${encodeURIComponent(status)}`, { method: "DELETE" });
      } else {
        await sbFetch("/status_ocultos", { method: "POST", body: JSON.stringify({ status }) });
      }
    } catch (e) {
      setStatusOcultos((prev) => (estaOculto ? [...prev, status] : prev.filter((s) => s !== status)));
      alert("Não foi possível atualizar a visibilidade do status: " + e.message);
    }
  }

  const chamadosVisiveis = useMemo(
    () => chamadosData.filter((c) => !statusOcultos.includes(c.status)),
    [chamadosData, statusOcultos]
  );

  const chamadosFiltrados = useMemo(
    () =>
      clienteFiltro === "Todos"
        ? chamadosVisiveis
        : chamadosVisiveis.filter((c) => c.cliente_nome === clienteFiltro),
    [chamadosVisiveis, clienteFiltro]
  );

  // Chamados com proposta ainda em aberto (sem status definido, ou "Enviado" aguardando
  // decisao do cliente) - representa o trabalho ativo/pipeline, sem contar o que ja foi
  // fechado comercialmente (Aprovado tem tela propria em "Aprovadas por Mês"; Bonificado,
  // Negada, Recusada, Cancelado, etc. tambem ja saíram de decisão).
  const chamadosPendentes = useMemo(
    () => chamadosFiltrados.filter((c) => !c.proposta_status || c.proposta_status === "Enviado"),
    [chamadosFiltrados]
  );

  const kpis = useMemo(() => {
    const total = chamadosPendentes.length;
    const totalHoras = chamadosPendentes.reduce((s, c) => s + Number(c.total_horas || 0), 0);
    const totalValor = chamadosPendentes.reduce((s, c) => s + Number(c.valor_total_projeto || 0), 0);
    const concluidos = chamadosPendentes.filter((c) => c.status === "Concluido").length;
    const encerrados = chamadosPendentes.filter((c) => c.status === "Encerrado").length;
    return { total, totalHoras, totalValor, concluidos, encerrados };
  }, [chamadosPendentes]);


  const volumeMensal = useMemo(() => {
    const nomesMes = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    const anoFoco = new Date().getFullYear();
    const contagem = Array(12).fill(0);
    chamadosFiltrados.forEach((c) => {
      if (!c.data_abertura) return;
      const d = parseDataLocal(c.data_abertura);
      if (d.getFullYear() === anoFoco) contagem[d.getMonth()]++;
    });
    let ultimoMes = 0;
    contagem.forEach((v, i) => { if (v > 0) ultimoMes = i; });
    return nomesMes.slice(0, ultimoMes + 1).map((mes, i) => ({ mes, chamados: contagem[i] }));
  }, [chamadosFiltrados]);

  const statusDistribuicao = useMemo(() => {
    const contagem = {};
    chamadosFiltrados.forEach((c) => {
      const s = c.status || "Sem status";
      contagem[s] = (contagem[s] || 0) + 1;
    });
    return Object.entries(contagem).sort((a, b) => b[1] - a[1]).map(([nome, valor]) => ({ nome, valor, cor: corStatus(nome) }));
  }, [chamadosFiltrados]);

  const analistasCarga = useMemo(() => {
    const nomesAtivos = new Set(analistas.filter((a) => a.ativo !== false).map((a) => a.nome));
    const contagem = {};
    chamadosFiltrados.forEach((c) => {
      const nome = c.analista_nome || "Sem analista";
      if (!nomesAtivos.has(nome)) return;
      contagem[nome] = (contagem[nome] || 0) + 1;
    });
    return Object.entries(contagem).sort((a, b) => b[1] - a[1]).map(([nome, chamados]) => ({ nome, chamados }));
  }, [chamadosFiltrados, analistas]);

  const topClientes = useMemo(() => {
    const anoFoco = new Date().getFullYear();
    const contagem = {};
    chamadosVisiveis.forEach((c) => {
      if (!c.data_abertura) return;
      if (parseDataLocal(c.data_abertura).getFullYear() !== anoFoco) return;
      contagem[c.cliente_nome] = (contagem[c.cliente_nome] || 0) + 1;
    });
    return Object.entries(contagem).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([nome, chamados]) => ({ nome, chamados }));
  }, [chamadosVisiveis]);

  const totalBacklog = useMemo(() => chamadosData.filter((c) => c.status === "BackLog").length, [chamadosData]);

  const anoFocoAtual = new Date().getFullYear();
  const nomesAnalistasAtivos = useMemo(() => new Set(analistas.filter((a) => a.ativo !== false).map((a) => a.nome)), [analistas]);

  // Distribuição por Analista (só analistas ativos; só propostas em aberto - vazia ou Enviado)
  const distribuicaoAnalista = useMemo(() => {
    const contagem = {};
    chamadosPendentes.forEach((c) => {
      const nome = c.analista_nome || "Sem analista";
      if (!nomesAnalistasAtivos.has(nome)) return;
      contagem[nome] = (contagem[nome] || 0) + 1;
    });
    return Object.entries(contagem).sort((a, b) => b[1] - a[1]).map(([nome, valor]) => ({ nome, valor }));
  }, [chamadosPendentes, nomesAnalistasAtivos]);

  // Top 10 Clientes x Analistas (só analistas ativos; só propostas em aberto - vazia ou Enviado)
  const clienteAnalistaMatrix = useMemo(() => {
    const nomesAnalistas = [...nomesAnalistasAtivos];
    const matrix = {};
    chamadosPendentes.forEach((c) => {
      const analista = c.analista_nome || "Sem analista";
      if (!nomesAnalistasAtivos.has(analista)) return;
      const cliente = c.cliente_nome || "Sem cliente";
      if (!matrix[cliente]) matrix[cliente] = {};
      matrix[cliente][analista] = (matrix[cliente][analista] || 0) + 1;
    });
    const linhas = Object.entries(matrix)
      .map(([cliente, porAnalista]) => ({ cliente, ...porAnalista, total: Object.values(porAnalista).reduce((s, v) => s + v, 0) }))
      .sort((a, b) => b.total - a.total)
      .slice(0, 10);
    return { linhas, analistas: nomesAnalistas };
  }, [chamadosPendentes, nomesAnalistasAtivos]);

  // Projetos Aprovados por Mês, no ano corrente (exclui Cancelado/Encerrado)
  const aprovadosPorMes = useMemo(() => {
    const mesesNomes = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
    const contagem = Array(12).fill(0);
    const valores = Array(12).fill(0);
    chamadosVisiveis.forEach((c) => {
      if (c.proposta_status !== "Aprovado" || !c.data_aprovacao) return;
      const data = parseDataLocal(c.data_aprovacao);
      if (!data || data.getFullYear() !== anoFocoAtual) return;
      contagem[data.getMonth()]++;
      valores[data.getMonth()] += Number(c.valor_total_projeto || 0);
    });
    let acumulado = 0;
    return mesesNomes.map((mes, i) => {
      acumulado += valores[i];
      return { mes, quantidade: contagem[i], valor: Math.round(valores[i] / 1000), acumulado: Math.round(acumulado / 1000) };
    });
  }, [chamadosVisiveis, anoFocoAtual]);

  const totalAprovadoAno = useMemo(() => ({
    quantidade: aprovadosPorMes.reduce((s, m) => s + m.quantidade, 0),
    valorK: aprovadosPorMes.reduce((s, m) => s + m.valor, 0),
  }), [aprovadosPorMes]);

  // Comparativo Ano a Ano - projetos Aprovados por mês, últimos 3 anos (calculado direto
  // dos chamados reais, sem depender de nenhuma planilha mantida à parte)
  const comparativoAnual = useMemo(() => {
    const mesesNomes = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
    const anosAlvo = [anoFocoAtual - 2, anoFocoAtual - 1, anoFocoAtual];
    const dadosPorAno = {};
    anosAlvo.forEach((ano) => { dadosPorAno[ano] = Array(12).fill(0); });
    chamadosVisiveis.forEach((c) => {
      if (c.proposta_status !== "Aprovado" || !c.data_aprovacao) return;
      const data = parseDataLocal(c.data_aprovacao);
      if (!data || !anosAlvo.includes(data.getFullYear())) return;
      dadosPorAno[data.getFullYear()][data.getMonth()] += Number(c.valor_total_projeto || 0);
    });
    const anosComDados = anosAlvo.filter((ano) => dadosPorAno[ano].some((v) => v > 0));
    const linhas = mesesNomes.map((mes, i) => {
      const linha = { mes };
      anosComDados.forEach((ano) => { linha[ano] = Math.round(dadosPorAno[ano][i] / 1000); });
      return linha;
    });
    return { linhas, anos: anosComDados };
  }, [chamadosVisiveis, anoFocoAtual]);

  // Projetos Aprovados por Analista, no ano corrente (exclui Cancelado/Encerrado)
  const aprovadosPorAnalista = useMemo(() => {
    const dados = {};
    chamadosVisiveis.forEach((c) => {
      if (c.proposta_status !== "Aprovado" || !c.data_aprovacao) return;
      const data = parseDataLocal(c.data_aprovacao);
      if (!data || data.getFullYear() !== anoFocoAtual) return;
      const nome = c.analista_nome || "Não Atribuído";
      if (!dados[nome]) dados[nome] = { quantidade: 0, valor: 0 };
      dados[nome].quantidade++;
      dados[nome].valor += Number(c.valor_total_projeto || 0);
    });
    return Object.entries(dados)
      .map(([nome, d]) => ({ nome, quantidade: d.quantidade, valor: Math.round(d.valor / 1000) }))
      .sort((a, b) => b.valor - a.valor);
  }, [chamadosVisiveis, anoFocoAtual]);

  // Top 10 Clientes - Projetos Aprovados, no ano corrente (exclui Cancelado/Encerrado)
  const top10ClientesAprovados = useMemo(() => {
    const dados = {};
    chamadosVisiveis.forEach((c) => {
      if (c.proposta_status !== "Aprovado" || !c.data_aprovacao) return;
      const data = parseDataLocal(c.data_aprovacao);
      if (!data || data.getFullYear() !== anoFocoAtual) return;
      const nome = c.cliente_nome || "Sem Cliente";
      if (!dados[nome]) dados[nome] = { quantidade: 0, valor: 0 };
      dados[nome].quantidade++;
      dados[nome].valor += Number(c.valor_total_projeto || 0);
    });
    return Object.entries(dados)
      .map(([nome, d]) => ({ nome, quantidade: d.quantidade, valor: Math.round(d.valor / 1000) }))
      .sort((a, b) => b.valor - a.valor)
      .slice(0, 10);
  }, [chamadosVisiveis, anoFocoAtual]);

  // Propostas Bonificadas por Cliente, no ano corrente (usa data de aprovacao ou, na falta, abertura; exclui Cancelado/Encerrado)
  const bonificadasPorCliente = useMemo(() => {
    const dados = {};
    chamadosVisiveis.forEach((c) => {
      if (c.proposta_status !== "Bonificado") return;
      const dataRef = c.data_aprovacao || c.data_abertura;
      if (!dataRef) return;
      const data = parseDataLocal(dataRef);
      if (!data || data.getFullYear() !== anoFocoAtual) return;
      const nome = c.cliente_nome || "Sem Cliente";
      if (!dados[nome]) dados[nome] = { quantidade: 0, valor: 0 };
      dados[nome].quantidade++;
      dados[nome].valor += Number(c.valor_total_projeto || 0);
    });
    return Object.entries(dados)
      .map(([nome, d]) => ({ nome, quantidade: d.quantidade, valor: Math.round(d.valor / 1000) }))
      .sort((a, b) => b.valor - a.valor);

  // % Propostas Aprovadas vs Bonificadas, no ano corrente (exclui Cancelado/Encerrado)

    chamadosVisiveis.forEach((c) => {

      const data = parseDataLocal(dataRef);
      if (!data || data.getFullYear() !== anoFocoAtual) return;
      if (c.proposta_status === "Aprovado") aprovadas++;
      if (c.proposta_status === "Bonificado") bonificadas++;
    });
    return [
      { nome: `Aprovadas (${aprovadas})`, valor: aprovadas },
      { nome: `Bonificadas (${bonificadas})`, valor: bonificadas },
    ];

// Rede de seguranca: se qualquer parte da tela travar de verdade (um erro que o
// React nao consegue renderizar), mostra uma mensagem explicando o que aconteceu
// em vez da tela ficar totalmente em branco sem nenhuma pista do que deu errado.
class ErrorBoundaryChamados extends React.Component {
  constructor(props) {
    super(props);
    this.state = { erro: null };
  }
  static getDerivedStateFromError(erro) {
    return { erro };
  }
  componentDidCatch(erro, info) {
    console.error("[ErrorBoundary] Falha ao renderizar:", erro, info);
  }
  render() {
    if (this.state.erro) {
      return (
        <div style={{ fontFamily: "sans-serif", padding: 40, maxWidth: 700, margin: "0 auto" }}>
          <h2 style={{ color: "#b91c1c" }}>Essa tela travou com um erro</h2>
          <p style={{ color: "#475569" }}>
            Alguma coisa deu errado ao carregar essa parte do Chamados. Copie a mensagem abaixo e mande pro
            desenvolvedor — ela mostra exatamente o que quebrou.
          </p>
          <pre
            style={{
              background: "#f8fafc",
              border: "1px solid #e2e8f0",
              borderRadius: 8,
              padding: 16,
              fontSize: 12,
              overflow: "auto",
              whiteSpace: "pre-wrap",
            }}
          >
            {this.state.erro && (this.state.erro.stack || this.state.erro.message || String(this.state.erro))}
          </pre>
          <button
            onClick={() => this.setState({ erro: null })}
            style={{ marginTop: 16, padding: "8px 16px", borderRadius: 6, border: "1px solid #cbd5e1", background: "#fff", cursor: "pointer" }}
          >
            Tentar de novo
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundaryChamados>
    <ChamadosDashboard />
  </ErrorBoundaryChamados>
);

<script>
  // Transforma o JSX manualmente, forçando o runtime "clássico" (React.createElement),
  // já que o runtime "automático" padrão do Babel gera um `import` que quebra fora de um bundler.
  var codigoFonte = document.getElementById("app-source").textContent;
  var codigoTransformado = Babel.transform(codigoFonte, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  var scriptFinal = document.createElement("script");
  scriptFinal.textContent = codigoTransformado;
  document.body.appendChild(scriptFinal);
</script>
