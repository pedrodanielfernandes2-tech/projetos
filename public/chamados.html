<div id="root">

    Carregando o painel...
  </div>
</div>

<script>
  // Diagnóstico automático: depois de alguns segundos, verifica quais
  // bibliotecas realmente carregaram e aponta exatamente qual falhou.
  setTimeout(function () {
    var placeholder = document.getElementById("carregando-inicial");
    if (!placeholder) return; // React já montou normalmente, nada a fazer

    var checagens = [
      ["React", typeof React !== "undefined"],
      ["ReactDOM", typeof ReactDOM !== "undefined"],
      ["PropTypes", typeof PropTypes !== "undefined"],
      ["Recharts", typeof Recharts !== "undefined"],
      ["Babel", typeof Babel !== "undefined"],
    ];
    var falhou = checagens.filter(function (c) { return !c[1]; }).map(function (c) { return c[0]; });

    var linhas = checagens.map(function (c) {
      var cor = c[1] ? "#15803d" : "#b91c1c";
      var status = c[1] ? "OK" : "NÃO CARREGOU";
      return '<div style="color:' + cor + '; font-family: monospace; margin: 4px 0;">' + c[0] + ": " + status + "</div>";
    }).join("");

    var mensagemFinal;
    if (falhou.length > 0) {
      mensagemFinal =
        '<p><strong>Não carregou:</strong> ' + falhou.join(", ") + '.</p>' +
        '<p>Isso costuma ser a internet/firewall bloqueando o domínio unpkg.com (de onde essas bibliotecas vêm). ' +
        'Tente em outra rede (ex: dados do celular) ou peça para o time de TI liberar unpkg.com.</p>';
    } else {
      mensagemFinal =
        '<p>Todas as bibliotecas carregaram, então o problema está em outro lugar (provavelmente a conexão com o Supabase). ' +
        'Abra o Console (F12 → aba Console) e procure uma linha vermelha — ela deve mencionar "supabase" ou "fetch".</p>';
    }

    document.getElementById("root").innerHTML =
      '<div style="font-family: sans-serif; color: #1e293b; padding: 40px; max-width: 700px; margin: 0 auto;">' +
      '<h2 style="color:#b91c1c;">O painel não terminou de carregar</h2>' +
      '<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:16px; margin: 16px 0;">' + linhas + '</div>' +
      mensagemFinal +
      '</div>';
  }, 4000);
</script>

// -----------------------------------------------------------------------
// Conexão com o backend do painel de Projetos (rotas /api/chamados-*),
// protegidas pela senha única do Chamados (igual ao Admin). A senha vem do
// sessionStorage, guardada na hora que a pessoa clicou em "Chamados" no menu.

const CHAMADOS_PASSWORD = sessionStorage.getItem("chamadosPassword");

// Traduz as chamadas no formato antigo (estilo Supabase/PostgREST) para as
// rotas novas do Express. Mantém a mesma assinatura de função (sbFetch) pra
// não precisar mexer em cada chamada espalhada pelo código abaixo.
async function sbFetch(caminhoAntigo, options = {}) {
  const [base, query] = caminhoAntigo.split("?");
  const method = (options.method || "GET").toUpperCase();

  let url;
  if (base === "/chamados_calculado") {
    url = "/api/chamados";
  } else if (base === "/clientes") {
    url = "/api/chamados-clientes";
  } else if (base === "/analistas") {
    const idMatch = query && query.match(/id=eq\.([\w-]+)/);
    url = idMatch ? `/api/chamados-analistas/${idMatch[1]}` : "/api/chamados-analistas";
  } else if (base === "/config_calculo") {
    const idMatch = query && query.match(/id=eq\.([\w-]+)/);
    url = idMatch ? `/api/chamados-config/${idMatch[1]}` : "/api/chamados-config";
  } else if (base === "/status_ocultos") {
    if (method === "DELETE") {
      const statusMatch = (query || "").match(/status=eq\.(.+)/);
      url = `/api/chamados-status-ocultos?status=${statusMatch ? statusMatch[1] : ""}`;
    } else {
      url = "/api/chamados-status-ocultos";
    }
  } else if (base === "/modelos_parcelamento") {
    const idMatch = query && query.match(/id=eq\.([\w-]+)/);
    url = idMatch ? `/api/chamados-modelos-parcelamento/${idMatch[1]}` : "/api/chamados-modelos-parcelamento";
  } else if (base === "/tabelas_recurso") {
    const idMatch = query && query.match(/id=eq\.([\w-]+)/);
    url = idMatch ? `/api/chamados-tabelas-recurso/${idMatch[1]}` : "/api/chamados-tabelas-recurso";
  } else if (base === "/chamados") {
    const idMatch = query && query.match(/id=eq\.([\w-]+)/);
    url = idMatch ? `/api/chamados/${idMatch[1]}` : "/api/chamados";
  } else {
    url = "/api" + base;
  }

  const res = await fetch(url, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "x-chamados-password": CHAMADOS_PASSWORD,
      ...(options.headers || {}),
    },
  });

  if (res.status === 401) {
    sessionStorage.removeItem("chamadosPassword");
    alert("Sessão do Chamados expirou ou senha inválida. Você será redirecionado.");
    window.location.href = "/";
    throw new Error("nao autorizado");
  }

  if (!res.ok) {
    const texto = await res.text().catch(() => "");
    throw new Error(`Erro ${res.status}: ${texto || res.statusText}`);
  }
  const tipo = res.headers.get("content-type") || "";
  return tipo.includes("application/json") ? res.json() : null;
}

// O Supabase devolve datas "puras" como texto "AAAA-MM-DD". Se passarmos isso
// direto pro `parseDataLocal(...)`, o JS interpreta como meia-noite em UTC — e como
// o Brasil está em UTC-3, a data exibida/agrupada acaba caindo no dia (ou mês)
// anterior. Esta função monta a data em horário local, evitando esse desvio.
function parseDataLocal(valor) {
  if (!valor) return null;
  if (valor instanceof Date) return valor;
  const partes = String(valor).slice(0, 10).split("-");
  if (partes.length === 3) {
    const [ano, mes, dia] = partes.map(Number);
    return new Date(ano, mes - 1, dia);
  }
  return new Date(valor);
}

// -----------------------------------------------------------------------
// Regra de cálculo (confirmada a partir dos dados reais da planilha)
// -----------------------------------------------------------------------
const CONFIG_PADRAO = { pctQA: 0.6, pctGerencial: 0.2, valorHora: 162.94 };

// Arredondamento ABNT NBR 5891: quando o algarismo a descartar é exatamente 5
// (sem mais nada depois), arredonda para o número par mais próximo; senão,
// segue a regra comum (< 5 mantém, > 5 sobe).
function arredondarABNT(valor, casas = 1) {
  if (valor === null || valor === undefined || isNaN(valor)) return valor;
  const fator = Math.pow(10, casas);
  const numero = valor * fator;
  const piso = Math.floor(numero);
  const diferenca = numero - piso;
  const EPS = 1e-9;
  let resultado;
  if (diferenca > 0.5 + EPS) {
    resultado = piso + 1;
  } else if (diferenca < 0.5 - EPS) {
    resultado = piso;
  } else {
    resultado = piso % 2 === 0 ? piso : piso + 1;
  }
  return resultado / fator;
}

function calcularChamado({ horasDev, pctMargem, pctNegociado, config, totalGeralManual }) {
  const cfg = config || CONFIG_PADRAO;
  const dev = Number(horasDev) || 0;
  const qa = arredondarABNT(dev * cfg.pctQA, 0);
  const gerencial = arredondarABNT((dev + qa) * cfg.pctGerencial, 0);
  const totalHoras = arredondarABNT(dev + qa + gerencial, 0);
  const horasMargem = arredondarABNT(totalHoras * (Number(pctMargem) || 0), 0);
  const totalGeralCalculado = arredondarABNT(totalHoras + horasMargem, 0);
  const totalGeralAjustado = totalGeralManual !== null && totalGeralManual !== undefined && totalGeralManual !== ''
    ? Number(totalGeralManual)
    : null;
  const totalGeral = totalGeralAjustado !== null && !isNaN(totalGeralAjustado) ? totalGeralAjustado : totalGeralCalculado;
  const valorProjeto = totalGeral * cfg.valorHora;
  const descontoNegociado = valorProjeto * (Number(pctNegociado) || 0);
  const valorTotalProjeto = valorProjeto - descontoNegociado;
  return { qa, gerencial, totalHoras, horasMargem, totalGeral, totalGeralCalculado, valorProjeto, descontoNegociado, valorTotalProjeto };
}

function calcularChamadoPorRecurso({ recursosHoras, pctMargem, pctNegociado }) {
  const valorBase = (recursosHoras || []).reduce((s, r) => s + (Number(r.horas) || 0) * (Number(r.valor_hora) || 0), 0);
  const valorProjeto = arredondarABNT(valorBase * (1 + (Number(pctMargem) || 0)), 2);
  const descontoNegociado = arredondarABNT(valorProjeto * (Number(pctNegociado) || 0), 2);
  const valorTotalProjeto = arredondarABNT(valorProjeto - descontoNegociado, 2);
  return { valorBase, valorProjeto, descontoNegociado, valorTotalProjeto };
}

function calcularChamadoValorFixo({ valorFixo }) {
  const valor = Number(valorFixo) || 0;
  return { valorBase: valor, valorProjeto: valor, descontoNegociado: 0, valorTotalProjeto: valor };
}

function ChamadoFormModal({ aberto, onFechar, onSalvar, salvando, onExcluir, excluindo, config, analistas = [], modelosParcelamento = [], tabelasRecurso = [], chamadoExistente }) {

  useEffect(() => {
    if (!aberto) return;
    if (chamadoExistente) {

      setNumero(String(chamadoExistente.numero ?? ""));

      setHorasDev(String(chamadoExistente.horas_dev ?? ""));
      setTotalGeralManual(chamadoExistente.total_geral_manual !== null && chamadoExistente.total_geral_manual !== undefined ? String(chamadoExistente.total_geral_manual) : "");
      setPctMargem(String(Number(chamadoExistente.pct_margem || 0) * 100));
      setPctNegociado(String(Number(chamadoExistente.pct_negociado || 0) * 100));
      setModeloParcelamentoId(chamadoExistente.modelo_parcelamento_id ? String(chamadoExistente.modelo_parcelamento_id) : "");
      setModoPrecificacao(chamadoExistente.modo_precificacao || "unico");
      setTabelaRecursoId(chamadoExistente.tabela_recurso_id ? String(chamadoExistente.tabela_recurso_id) : "");
      if (Array.isArray(chamadoExistente.recursos_horas)) {
        const mapa = {};
        chamadoExistente.recursos_horas.forEach((r) => { mapa[r.papel] = String(r.horas); });
        setHorasPorPapel(mapa);
      } else {
        setHorasPorPapel({});
      }
      setValorFixo(chamadoExistente.valor_fixo ? String(chamadoExistente.valor_fixo) : "");
      setProjetoFechado(
        Number(chamadoExistente.pct_qa_aplicado || 0) === 0 && Number(chamadoExistente.pct_gerencial_aplicado || 0) === 0
      );
      setUsarReguaVigente(false);
    } else {
      setCliente("");
      setNumero("");
      setDescricao("");
      setAnalista(analistas[0]?.nome || "");
      setStatus("A Iniciar");
      setGrupoTrabalho("");
      setComplexidade("");
      setPropostaStatus("");
      setDataEnvioProposta("");
      setDataAprovacao("");
      setHorasDev("");
      setTotalGeralManual("");
      setPctMargem("10");
      setPctNegociado("0");
      setModeloParcelamentoId(modelosParcelamento.find((m) => m.nome.includes("Padrão"))?.id ? String(modelosParcelamento.find((m) => m.nome.includes("Padrão")).id) : "");
      setModoPrecificacao("unico");
      setTabelaRecursoId("");
      setHorasPorPapel({});
      setValorFixo("");
      setProjetoFechado(false);
      setUsarReguaVigente(false);
    }
  }, [aberto, chamadoExistente]);

  if (!aberto) return null;

  // no modo edição, usa a régua que estava salva NAQUELE chamado (não a atual) --
  // a menos que a pessoa clique em "usar valor de hora vigente", nesse caso usa a config atual
  const cfgCalculoBase = editando && !usarReguaVigente
    ? {
        pctQA: Number(chamadoExistente.pct_qa_aplicado),
        pctGerencial: Number(chamadoExistente.pct_gerencial_aplicado),
        valorHora: Number(chamadoExistente.valor_hora_aplicado),
      }
    : config;

  // "projeto fechado" = horas já vêm prontas (ex: alocação de recursos), sem QA/Gerencial
  const cfgCalculo = projetoFechado ? { ...cfgCalculoBase, pctQA: 0, pctGerencial: 0 } : cfgCalculoBase;

  const calc = calcularChamado({
    horasDev,
    pctMargem: Number(pctMargem) / 100,
    pctNegociado: Number(pctNegociado) / 100,
    config: cfgCalculo,
    totalGeralManual,
  });

  const tabelaRecursoSelecionada = tabelasRecurso.find((t) => String(t.id) === tabelaRecursoId);
  const recursosHorasArray = tabelaRecursoSelecionada
    ? tabelaRecursoSelecionada.papeis.map((p) => ({ papel: p.papel, valor_hora: p.valor_hora, horas: Number(horasPorPapel[p.papel] || 0) }))
    : [];
  const calcPorRecurso = calcularChamadoPorRecurso({
    recursosHoras: recursosHorasArray,
    pctMargem: Number(pctMargem) / 100,
    pctNegociado: Number(pctNegociado) / 100,
  });
  const calcValorFixo = calcularChamadoValorFixo({ valorFixo });
  const calcFinal = modoPrecificacao === "por_recurso" ? calcPorRecurso : modoPrecificacao === "valor_fixo" ? calcValorFixo : calc;

  const fmt = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  const fmtMoeda = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  const podeSalvar =
    cliente.trim() &&
    numero &&
    Number(numero) > 0 &&
    (modoPrecificacao === "por_recurso"
      ? recursosHorasArray.some((r) => r.horas > 0)
      : modoPrecificacao === "valor_fixo"
      ? Number(valorFixo) > 0
      : Number(horasDev) >= 0);

  function handleSalvar() {
    onSalvar({
      id: chamadoExistente?.id,
      numero: Number(numero),
      cliente,
      descricao,
      analista,
      status,
      grupoTrabalho,
      complexidade,
      propostaStatus,
      dataEnvioProposta: dataEnvioProposta || null,
      dataAprovacao: dataAprovacao || null,
      horasDev: Number(horasDev),
      totalGeralManual: totalGeralManual === "" ? "" : Number(totalGeralManual),
      pctMargem: Number(pctMargem) / 100,
      pctNegociado: Number(pctNegociado) / 100,
      modeloParcelamentoId: modeloParcelamentoId || null,
      pctQaAplicado: cfgCalculo.pctQA,
      pctGerencialAplicado: cfgCalculo.pctGerencial,
      valorHoraAplicado: cfgCalculo.valorHora,
      modoPrecificacao,
      tabelaRecursoId: modoPrecificacao === "por_recurso" ? (tabelaRecursoId || null) : null,
      recursosHoras: modoPrecificacao === "por_recurso" ? recursosHorasArray.filter((r) => r.horas > 0) : null,
      valorFixo: modoPrecificacao === "valor_fixo" ? Number(valorFixo) : 0,
    });
  }

  return (
    <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto shadow-xl">
        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h2 className="text-base font-semibold text-slate-900" style={{ fontFamily: "'Poppins', sans-serif" }}>
            {editando ? `Editar Chamado #${chamadoExistente.numero}` : "Novo Chamado"}
          </h2>
          <button onClick={onFechar} className="text-slate-400 hover:text-slate-600">
            <X size={18} />
          </button>
        </div>

        <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
          {/* Campos manuais */}
          <div className="space-y-4">
            <div className="grid grid-cols-3 gap-3">
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Nº do chamado</label>
                <input
                  type="number"
                  value={numero}
                  onChange={(e) => setNumero(e.target.value)}
                  placeholder="Ex: 90125"
                  className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
                />
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Cliente</label>
                <input
                  value={cliente}
                  onChange={(e) => setCliente(e.target.value)}
                  disabled={editando}
                  placeholder="Ex: Boa Jundiaí"
                  className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6] disabled:bg-slate-50 disabled:text-slate-400"
                />
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Status</label>
                <select
                  value={status}
                  onChange={(e) => setStatus(e.target.value)}
                  className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
                >
                  {OPCOES_STATUS.map((s) => (
                    <option key={s}>{s}</option>
                  ))}
                </select>
              </div>
            </div>

            <div>
              <label className="text-xs font-medium text-slate-500 block mb-1">Descrição</label>
              <input
                value={descricao}
                onChange={(e) => setDescricao(e.target.value)}
                placeholder="Ex: Integração PDV"
                className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
              />
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Analista</label>
                <select
                  value={analista}
                  onChange={(e) => setAnalista(e.target.value)}
                  className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
                >
                  <option value="">—</option>
                  {analistas
                    .filter((a) => a.ativo !== false || a.nome === analista)
                    .map((a) => (
                      <option key={a.id} value={a.nome}>
                        {a.nome}
                        {a.ativo === false ? " (inativo)" : ""}
                      </option>
                    ))}
                </select>
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Grupo de Trabalho</label>
                <input
                  value={grupoTrabalho}
                  onChange={(e) => setGrupoTrabalho(e.target.value)}
                  placeholder="Ex: PDV / Integração"
                  className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
                />
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Complexidade</label>
                <input
                  value={complexidade}
                  onChange={(e) => setComplexidade(e.target.value)}
                  placeholder="Ex: 2 ou Médio"
                  className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
                />
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Proposta</label>
                <select
                  value={propostaStatus}
                  onChange={(e) => setPropostaStatus(e.target.value)}
                  className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
                >
                  {OPCOES_PROPOSTA.map((s) => (
                    <option key={s || "vazio"} value={s}>
                      {s || "—"}
                    </option>
                  ))}
                </select>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Data Envio Proposta</label>
                <input
                  type="date"
                  value={dataEnvioProposta || ""}
                  onChange={(e) => setDataEnvioProposta(e.target.value)}
                  className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
                />
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Data Aprovação</label>
                <input
                  type="date"
                  value={dataAprovacao || ""}
                  onChange={(e) => setDataAprovacao(e.target.value)}
                  className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
                />
              </div>
            </div>

            <div className="pt-2 border-t border-slate-100">
              <label className="text-xs font-medium text-slate-500 block mb-1">Modo de precificação</label>
              <div className="flex gap-2 mb-3">
                <button
                  type="button"
                  onClick={() => setModoPrecificacao("unico")}
                  className={
                    "flex-1 text-xs font-medium px-3 py-2 rounded-md border " +
                    (modoPrecificacao === "unico" ? "text-white border-transparent" : "text-slate-600 border-slate-200 bg-white")
                  }
                  style={modoPrecificacao === "unico" ? { backgroundColor: BRAND_BLUE } : {}}
                >
                  Valor hora
                </button>
                <button
                  type="button"
                  onClick={() => setModoPrecificacao("por_recurso")}
                  className={
                    "flex-1 text-xs font-medium px-3 py-2 rounded-md border " +
                    (modoPrecificacao === "por_recurso" ? "text-white border-transparent" : "text-slate-600 border-slate-200 bg-white")
                  }
                  style={modoPrecificacao === "por_recurso" ? { backgroundColor: BRAND_BLUE } : {}}
                >
                  Por recurso (papel)
                </button>
                <button
                  type="button"
                  onClick={() => setModoPrecificacao("valor_fixo")}
                  className={
                    "flex-1 text-xs font-medium px-3 py-2 rounded-md border " +
                    (modoPrecificacao === "valor_fixo" ? "text-white border-transparent" : "text-slate-600 border-slate-200 bg-white")
                  }
                  style={modoPrecificacao === "valor_fixo" ? { backgroundColor: BRAND_BLUE } : {}}
                >
                  Valor fixo
                </button>
              </div>
            </div>

            {modoPrecificacao === "unico" ? (
            <div className="pt-2 border-t border-slate-100">
              <label className="flex items-center gap-2 mb-2 cursor-pointer">
                <input
                  type="checkbox"
                  checked={projetoFechado}
                  onChange={(e) => setProjetoFechado(e.target.checked)}
                  className="w-4 h-4"
                />
                <span className="text-xs font-medium text-slate-600">
                  Projeto fechado (sem QA/Gerencial) — ex: alocação de recursos
                </span>
              </label>
              <label className="text-xs font-medium text-slate-500 block mb-1">Horas Dev</label>
              <input
                type="number"
                min="0"
                value={horasDev}
                onChange={(e) => setHorasDev(e.target.value)}
                placeholder="Ex: 40"
                className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
              />
              <p className="text-[11px] text-slate-400 mt-1">
                {projetoFechado
                  ? "Horas fechadas do projeto — QA e Gerencial não entram no cálculo."
                  : `QA (${Math.round(cfgCalculo.pctQA * 100)}%) e Gerencial (${Math.round(
                      cfgCalculo.pctGerencial * 100
                    )}%) são calculados automaticamente.`}
              </p>
            </div>
            ) : modoPrecificacao === "por_recurso" ? (
            <div className="pt-2 border-t border-slate-100">
              <label className="text-xs font-medium text-slate-500 block mb-1">Tabela de recursos</label>
              <select
                value={tabelaRecursoId}
                onChange={(e) => setTabelaRecursoId(e.target.value)}
                className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6] mb-3"
              >
                <option value="">Selecione uma tabela...</option>
                {tabelasRecurso.filter((t) => t.ativo !== false).map((t) => (
                  <option key={t.id} value={t.id}>{t.nome}</option>
                ))}
              </select>
              {tabelaRecursoSelecionada ? (
                <div className="space-y-1.5">
                  {tabelaRecursoSelecionada.papeis.map((p) => (
                    <div key={p.papel} className="flex items-center gap-2">
                      <span className="text-xs text-slate-600 flex-1">
                        {p.papel} <span className="text-slate-400">(R$ {p.valor_hora.toFixed(2).replace(".", ",")}/h)</span>
                      </span>
                      <input
                        type="number"
                        min="0"
                        value={horasPorPapel[p.papel] || ""}
                        onChange={(e) => setHorasPorPapel((prev) => ({ ...prev, [p.papel]: e.target.value }))}
                        placeholder="0"
                        className="w-20 border border-slate-200 rounded-md px-2 py-1.5 text-sm outline-none focus:border-[#3B82D6]"
                      />
                      <span className="text-xs text-slate-400">h</span>
                    </div>
                  ))}
                </div>
              ) : (
                <p className="text-xs text-slate-400">Escolha uma tabela de recursos pra informar as horas de cada papel.</p>
              )}
            </div>
            ) : (
            <div className="pt-2 border-t border-slate-100">
              <label className="text-xs font-medium text-slate-500 block mb-1">Valor Fixo do Projeto (R$)</label>
              <input
                type="number"
                min="0"
                step="0.01"
                value={valorFixo}
                onChange={(e) => setValorFixo(e.target.value)}
                placeholder="Ex: 5000"
                className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
              />
              <p className="text-[11px] text-slate-400 mt-1">
                Esse é o valor final do projeto, sem nenhum cálculo por cima — % Margem e % Negociado não se aplicam nesse modo.
              </p>
            </div>
            )}

            <div className="grid grid-cols-2 gap-3">
              {modoPrecificacao !== "valor_fixo" && (
              <>
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">% Margem</label>
                <input
                  type="number"
                  min="0"
                  value={pctMargem}
                  onChange={(e) => setPctMargem(e.target.value)}
                  className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
                />
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">% Negociado (desconto)</label>
                <input
                  type="number"
                  min="0"
                  max="100"
                  value={pctNegociado}
                  onChange={(e) => setPctNegociado(e.target.value)}
                  className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
                />
              </div>
              </>
              )}
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Modelo de parcelamento</label>
                <select
                  value={modeloParcelamentoId}
                  onChange={(e) => setModeloParcelamentoId(e.target.value)}
                  className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
                >
                  <option value="">Sem modelo (à vista)</option>
                  {modelosParcelamento.filter((m) => m.ativo !== false).map((m) => (
                    <option key={m.id} value={m.id}>
                      {m.nome} ({m.parcelas.map((p) => `${p.dias}d ${Math.round(p.percentual * 100)}%`).join(" / ")})
                    </option>
                  ))}
                </select>
              </div>
            </div>
          </div>

          {/* Painel calculado */}
          <div className="bg-slate-50 rounded-lg p-4 h-fit">
            <div className="text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-2">
              Calculado automaticamente
            </div>
            {modoPrecificacao === "unico" ? (
              <>
                <LinhaCalculada label="Horas QA" value={`${fmt(calc.qa)}h`} />
                <LinhaCalculada label="Horas Gerencial" value={`${fmt(calc.gerencial)}h`} />
                <LinhaCalculada label="Total Horas" value={`${fmt(calc.totalHoras)}h`} />
                <div className="h-px bg-slate-200 my-2" />
                <LinhaCalculada label="Horas Margem" value={`${fmt(calc.horasMargem)}h`} />
                <div className="flex items-center justify-between py-1.5 gap-2">
                  <span className="text-xs text-slate-400">Total Geral (h)</span>
                  <div className="flex items-center gap-1.5">
                    <input
                      type="number"
                      min="0"
                      step="1"
                      value={totalGeralManual}
                      onChange={(e) => setTotalGeralManual(e.target.value)}
                      placeholder={String(calc.totalGeralCalculado)}
                      className="w-20 text-sm text-right tabular-nums border border-slate-200 rounded px-2 py-1"
                      style={{ fontFamily: "'IBM Plex Mono', monospace" }}
                      title="Ajuste manual - por exemplo, arredondar pra um múltiplo de 8. Deixe em branco pra usar o cálculo automático."
                    />
                    <span className="text-sm">h</span>
                    {totalGeralManual !== "" && (
                      <button
                        type="button"
                        onClick={() => setTotalGeralManual("")}
                        className="text-[11px] text-slate-400 underline hover:text-slate-600"
                        title="Voltar para o valor calculado automaticamente"
                      >
                        automático
                      </button>
                    )}
                  </div>
                </div>
                {totalGeralManual !== "" && Number(totalGeralManual) !== calc.totalGeralCalculado && (
                  <p className="text-[11px] text-amber-600 -mt-1 mb-1">Ajustado manualmente (calculado seria {fmt(calc.totalGeralCalculado)}h)</p>
                )}
                <div className="h-px bg-slate-200 my-2" />
              </>
            ) : modoPrecificacao === "por_recurso" ? (
              <>
                <LinhaCalculada label="Valor Base (soma por papel)" value={fmtMoeda(calcFinal.valorBase)} />
                <div className="h-px bg-slate-200 my-2" />
              </>
            ) : null}
            {modoPrecificacao !== "valor_fixo" && (
              <>
                <LinhaCalculada label="Valor do Projeto" value={fmtMoeda(calcFinal.valorProjeto)} />
                <LinhaCalculada label="Desconto Negociado" value={`- ${fmtMoeda(calcFinal.descontoNegociado)}`} />
                <div className="h-px bg-slate-200 my-2" />
              </>
            )}
            <LinhaCalculada label="Valor Total do Projeto" value={fmtMoeda(calcFinal.valorTotalProjeto)} destaque />
            <div className="text-[10px] text-slate-400 mt-3">
              {modoPrecificacao === "unico"
                ? `${editando ? (usarReguaVigente ? "Usando o valor de hora vigente" : "Régua aplicada neste chamado") : "Parâmetros vigentes"}: QA ${Math.round(cfgCalculo.pctQA * 100)}% · Gerencial ${Math.round(cfgCalculo.pctGerencial * 100)}% · R$ ${cfgCalculo.valorHora.toFixed(2).replace(".", ",")}/h`
                : modoPrecificacao === "por_recurso"
                ? (tabelaRecursoSelecionada ? `Tabela: ${tabelaRecursoSelecionada.nome}` : "Escolha uma tabela de recursos")
                : "Valor fixo, sem cálculo adicional"}
            </div>
            {editando && modoPrecificacao === "unico" && !usarReguaVigente && (
              <button
                type="button"
                onClick={() => setUsarReguaVigente(true)}
                className="text-[11px] mt-1.5 underline"
                style={{ color: BRAND_BLUE }}
              >
                Usar valor de hora vigente (R$ {config.valorHora.toFixed(2).replace(".", ",")}/h) em vez do salvo neste chamado
              </button>
            )}
          </div>
        </div>

        <div className="flex items-center justify-between gap-3 px-6 py-4 border-t border-slate-100 bg-slate-50/50 rounded-b-xl">
          <div>
            {editando && (
              <button
                type="button"
                disabled={excluindo || salvando}
                onClick={() => onExcluir && onExcluir(chamadoExistente.id)}
                className="text-sm text-red-600 px-4 py-2 hover:text-red-700 disabled:opacity-40"
              >
                {excluindo ? "Excluindo..." : "Excluir chamado"}
              </button>
            )}
          </div>
          <div className="flex items-center gap-3">
            <button onClick={onFechar} className="text-sm text-slate-500 px-4 py-2 hover:text-slate-700">
              Cancelar
            </button>
            <button
              disabled={!podeSalvar || salvando}
              onClick={handleSalvar}
              className="text-sm text-white px-4 py-2 rounded-md disabled:opacity-40"
              style={{ backgroundColor: BRAND_BLUE }}
            >
              {salvando ? "Salvando..." : editando ? "Salvar Alterações" : "Salvar Chamado"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ModelosParcelamentoSecao({ modelos = [], onCriar, onAtualizar, onExcluir }) {
  const [criando, setCriando] = useState(false);
  const [nome, setNome] = useState("");
  const [linhas, setLinhas] = useState([{ dias: 15, percentual: 100 }]);
  const [salvandoModelo, setSalvandoModelo] = useState(false);

  const somaPercentual = linhas.reduce((s, l) => s + Number(l.percentual || 0), 0);

  function atualizarLinha(i, campo, valor) {
    setLinhas((prev) => prev.map((l, idx) => (idx === i ? { ...l, [campo]: valor } : l)));
  }
  function adicionarLinha() {
    setLinhas((prev) => [...prev, { dias: 30, percentual: 0 }]);
  }
  function removerLinha(i) {
    setLinhas((prev) => prev.filter((_, idx) => idx !== i));
  }
  function resetarForm() {
    setNome("");
    setLinhas([{ dias: 15, percentual: 100 }]);
    setCriando(false);
  }

  async function salvarNovoModelo() {
    if (!nome.trim()) {
      alert("Dê um nome ao modelo.");
      return;
    }

function TabelasRecursoSecao({ tabelas = [], onCriar, onAtualizar, onExcluir }) {
  const fmtMoeda = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const [criando, setCriando] = useState(false);
  const [nome, setNome] = useState("");
  const [linhas, setLinhas] = useState([{ papel: "", valor_hora: "" }]);
  const [salvandoTabela, setSalvandoTabela] = useState(false);

  function atualizarLinha(i, campo, valor) {
    setLinhas((prev) => prev.map((l, idx) => (idx === i ? { ...l, [campo]: valor } : l)));
  }
  function adicionarLinha() {
    setLinhas((prev) => [...prev, { papel: "", valor_hora: "" }]);
  }
  function removerLinha(i) {
    setLinhas((prev) => prev.filter((_, idx) => idx !== i));
  }
  function resetarForm() {
    setNome("");
    setLinhas([{ papel: "", valor_hora: "" }]);
    setCriando(false);
  }

  async function salvarNovaTabela() {
    if (!nome.trim()) {
      alert("Dê um nome à tabela.");
      return;
    }
    if (linhas.some((l) => !l.papel.trim() || !l.valor_hora)) {
      alert("Preencha o nome e o valor de hora de todos os papéis (ou remova as linhas vazias).");
      return;
    }
    setSalvandoTabela(true);
    const ok = await onCriar(
      nome.trim(),
      linhas.map((l) => ({ papel: l.papel.trim(), valor_hora: Number(l.valor_hora) }))
    );
    setSalvandoTabela(false);
    if (ok) resetarForm();
  }

  return (
    <div>
      <p className="text-xs font-medium text-slate-500 mb-1 mt-4">Tabelas de Recurso</p>
      <p className="text-xs text-slate-400 mb-3">
        Pra clientes cuja negociação é por papel/recurso (cada função com seu próprio valor de hora), em vez
        de um valor de hora único. Escolha a tabela na hora de criar ou editar o chamado.
      </p>
      <div className="space-y-2">
        {tabelas.map((t) => (
          <div key={t.id} className="flex items-center justify-between px-3 py-2 rounded-md border border-slate-100">
            <div>
              <p className={"text-sm " + (t.ativo === false ? "text-slate-400" : "text-slate-700")}>
                {t.nome}
                {t.ativo === false ? " (inativo)" : ""}
              </p>
              <p className="text-xs text-slate-400">
                {t.papeis.map((p) => `${p.papel}: ${fmtMoeda(p.valor_hora)}`).join(" · ")}
              </p>
            </div>
            <div className="flex items-center gap-3 shrink-0 ml-3">
              <button onClick={() => onAtualizar(t.id, { ativo: t.ativo === false })} className="text-xs text-slate-500 hover:text-slate-700">
                {t.ativo === false ? "Reativar" : "Desativar"}
              </button>
              <button onClick={() => onExcluir(t.id)} className="text-xs text-red-500 hover:text-red-700">
                Excluir
              </button>
            </div>
          </div>
        ))}
        {tabelas.length === 0 && <p className="text-xs text-slate-400">Nenhuma tabela cadastrada ainda.</p>}
      </div>

      {!criando ? (
        <button onClick={() => setCriando(true)} className="text-sm mt-3" style={{ color: BRAND_BLUE }}>
          + Nova tabela de recursos
        </button>
      ) : (
        <div className="mt-3 border border-slate-200 rounded-md p-3 space-y-2">
          <input
            value={nome}
            onChange={(e) => setNome(e.target.value)}
            placeholder="Nome da tabela (ex: Tabela Padrão de Recursos)"
            className="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:border-[#3B82D6]"
          />
          {linhas.map((l, i) => (
            <div key={i} className="flex items-center gap-2">
              <input
                value={l.papel}
                onChange={(e) => atualizarLinha(i, "papel", e.target.value)}

              />
              <span className="text-xs text-slate-400">R$</span>
              <input
                type="number"
                min="0"
                step="0.01"
                value={l.valor_hora}
                onChange={(e) => atualizarLinha(i, "valor_hora", e.target.value)}
                placeholder="Valor/hora"
                className="w-28 border border-slate-200 rounded-md px-2 py-1.5 text-sm outline-none"
              />
              {linhas.length > 1 && (
                <button onClick={() => removerLinha(i)} className="text-xs text-red-500">

function MultiSelectFiltro({ label, opcoes, selecionados, onChange }) {
  const [aberto, setAberto] = useState(false);
  const ref = React.useRef(null);

  useEffect(() => {
    function fecharFora(e) {
      if (ref.current && !ref.current.contains(e.target)) setAberto(false);
    }
    document.addEventListener("mousedown", fecharFora);
    return () => document.removeEventListener("mousedown", fecharFora);
  }, []);

  function toggle(opcao) {
    if (selecionados.includes(opcao)) {
      onChange(selecionados.filter((o) => o !== opcao));
    } else {
      onChange([...selecionados, opcao]);
    }
  }

  const texto = selecionados.length === 0 ? label : `${label} (${selecionados.length})`;

  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setAberto((v) => !v)}
        className="text-sm border border-slate-200 rounded-md px-3 py-2 text-slate-600 flex items-center gap-2 bg-white"
      >
        {texto}
        <ChevronRight size={12} className={`transition-transform ${aberto ? "rotate-90" : "rotate-0"} text-slate-400`} />
      </button>
      {aberto && (
        <div className="absolute z-20 mt-1 w-56 max-h-64 overflow-y-auto bg-white border border-slate-200 rounded-md shadow-lg py-1">
          {selecionados.length > 0 && (
            <button
              onClick={() => onChange([])}
              className="w-full text-left px-3 py-1.5 text-xs text-slate-400 hover:bg-slate-50"
            >
              Limpar seleção
            </button>
          )}
          {opcoes.map((op) => (
            <label
              key={op}
              className="flex items-center gap-2 px-3 py-1.5 text-sm text-slate-600 hover:bg-slate-50 cursor-pointer"
            >
              <input type="checkbox" checked={selecionados.includes(op)} onChange={() => toggle(op)} />
              {op}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

function AprovadasPorMesPage({ chamados, onEditar }) {
  const [busca, setBusca] = useState("");
  const [mesSelecionado, setMesSelecionado] = useState(null);

  const NOMES_MES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

  const fmtMoeda = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const fmtPct = (v) => `${(Number(v || 0) * 100).toFixed(2)}%`;
  const fmtData = (d) => (d ? parseDataLocal(d).toLocaleDateString("pt-BR") : "—");

  const PRAZOS_PARCELA = [15, 30, 60, 90];
  function parcelasDe(c) {
    const valorTotal = Number(c.valor_total_projeto || 0);
    if (Array.isArray(c.modelo_parcelamento_parcelas) && c.modelo_parcelamento_parcelas.length > 0) {
      return c.modelo_parcelamento_parcelas.map((p) => ({ dias: p.dias, valor: valorTotal * p.percentual }));
    }
    // fallback pro comportamento antigo, pra chamados que nao tem um modelo definido
    const qtd = Math.min(Math.max(Number(c.qtd_parcelas) || 1, 1), 4);
    const valorParcela = valorTotal / qtd;
    return PRAZOS_PARCELA.slice(0, qtd).map((dias) => ({ dias, valor: valorParcela }));
  }

  // "relevantes" = tudo que é Aprovado ou Bonificado (aparece nas tabelas mensais);
  // só o Aprovado entra nos totais e nos KPIs (Bonificado é registrado mas não conta valor).
  const relevantes = useMemo(() => {
    const alvo = chamados.filter((c) => c.proposta_status === "Aprovado" || c.proposta_status === "Bonificado");
    if (!busca.trim()) return alvo;
    const termo = busca.trim().toLowerCase();
    return alvo.filter((c) => `${c.numero} ${c.cliente_nome} ${c.descricao || ""}`.toLowerCase().includes(termo));
  }, [chamados, busca]);

  const aprovadas = useMemo(() => relevantes.filter((c) => c.proposta_status === "Aprovado"), [relevantes]);

  const valorTotal = useMemo(
    () => aprovadas.reduce((s, c) => s + Number(c.valor_total_projeto || 0), 0),
    [aprovadas]
  );
  const ticketMedio = aprovadas.length ? valorTotal / aprovadas.length : 0;

  const porMesGrafico = useMemo(() => {
    const anoFoco = new Date().getFullYear();
    const contagem = Array(12).fill(0);
    const valores = Array(12).fill(0);
    aprovadas.forEach((c) => {
      const dataRef = c.data_aprovacao || c.data_abertura;
      if (!dataRef) return;
      const d = parseDataLocal(dataRef);
      if (d.getFullYear() === anoFoco) {
        contagem[d.getMonth()]++;
        valores[d.getMonth()] += Number(c.valor_total_projeto || 0);
      }
    });
    let ultimoMes = 0;
    contagem.forEach((v, i) => {
      if (v > 0) ultimoMes = i;
    });
    return NOMES_MES.slice(0, ultimoMes + 1).map((mes, i) => ({
      mes,
      aprovadas: contagem[i],
      valor: Math.round(valores[i]),
    }));
  }, [aprovadas]);

  // agrupa Aprovado + Bonificado por mês/ano de aprovação (com fallback pra envio/abertura)
  const gruposPorMes = useMemo(() => {
    const mapa = {};
    relevantes.forEach((c) => {
      const dataRef = c.data_aprovacao || c.data_envio_proposta || c.data_abertura;
      if (!dataRef) return;
      const d = parseDataLocal(dataRef);
      const chave = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      if (!mapa[chave]) mapa[chave] = [];
      mapa[chave].push(c);
    });
    return Object.entries(mapa)
      .sort((a, b) => b[0].localeCompare(a[0]))
      .map(([chave, itens]) => {
        const [ano, mes] = chave.split("-");
        const soAprovados = itens.filter((i) => i.proposta_status === "Aprovado");
        return {
          chave,
          ano,
          mes,
          itens: itens.sort(
            (a, b) =>
              parseDataLocal(a.data_aprovacao || a.data_abertura) - parseDataLocal(b.data_aprovacao || b.data_abertura)
          ),
          totalProjeto: soAprovados.reduce((s, i) => s + Number(i.valor_projeto || 0), 0),
          totalDesconto: soAprovados.reduce((s, i) => s + Number(i.desconto_negociado || 0), 0),
          totalValorTotal: soAprovados.reduce((s, i) => s + Number(i.valor_total_projeto || 0), 0),
        };
      });
  }, [relevantes]);

  // Controle Anual de Vendas: usa a MESMA base das tabelas "Aprovadas por Mês" —
  // só chamados com proposta Aprovado, somados pela data de aprovação (com
  // fallback pra envio/abertura) — pra bater com o total de cada mês lá em baixo.
  // Usa "chamados" direto (não "aprovadas"), pra não encolher quando alguém
  // usa a busca da página — o Controle Anual é sempre a visão geral, sem filtro.
  // (a partir de 2023, pra caber na tela sem precisar arrastar demais)
  const controleAnual = useMemo(() => {
    const ANO_MINIMO = 2023;
    const porAno = {};
    chamados
      .filter((c) => c.proposta_status === "Aprovado")
      .forEach((c) => {
        const dataRef = c.data_aprovacao || c.data_envio_proposta || c.data_abertura;
        if (!dataRef) return;
        const d = parseDataLocal(dataRef);
        const ano = d.getFullYear();
        if (ano < ANO_MINIMO) return;
        if (!porAno[ano]) porAno[ano] = Array(12).fill(0);
        porAno[ano][d.getMonth()] += Number(c.valor_total_projeto || 0);
      });
    const anos = Object.keys(porAno)
      .map(Number)
      .sort((a, b) => a - b);
    return { anos, porAno };
  }, [chamados]);

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <KpiCard label="Propostas Aprovadas" value={aprovadas.length} sub="Todos os períodos" accent="#0F172A" />
        <KpiCard label="Valor Total Aprovado" value={fmtMoeda(valorTotal)} sub="Todos os períodos" accent="#0F8A6B" />
        <KpiCard label="Ticket Médio" value={fmtMoeda(ticketMedio)} sub="Todos os períodos" accent="#7C3AED" />
      </div>

      <div className="bg-white border border-slate-200 rounded-lg p-5">
        <h2 className="text-sm font-semibold text-slate-800 mb-4">Aprovadas por Mês · {new Date().getFullYear()}</h2>
        <ResponsiveContainer width="100%" height={220}>
          <BarChart data={porMesGrafico} margin={{ top: 24 }}>
            <CartesianGrid stroke="#EEF0EC" vertical={false} />
            <XAxis dataKey="mes" tick={{ fontSize: 12, fill: "#94a3b8" }} axisLine={false} tickLine={false} />
            <YAxis tick={{ fontSize: 12, fill: "#94a3b8" }} axisLine={false} tickLine={false} />
            <Tooltip formatter={(v, nome) => (nome === "aprovadas" ? [v, "Aprovadas"] : [fmtMoeda(v), "Valor"])} />
            <Bar dataKey="aprovadas" fill="#0F8A6B" radius={[4, 4, 0, 0]}>
              <LabelList dataKey="valor" position="top" formatter={(v) => (v > 0 ? `R$ ${(v / 1000).toFixed(1)}k` : "")} style={{ fontSize: 11, fill: "#475569" }} />
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>

      {/* Controle Anual de Vendas */}
      {controleAnual.anos.length > 0 && (
        <div className="bg-white border border-slate-200 rounded-lg p-5 overflow-x-auto">
          <h2 className="text-sm font-semibold text-slate-800 mb-1">Controle Anual de Vendas</h2>
          <p className="text-xs text-slate-400 mb-4">
            Valores mensais, acumulados e variação % em relação ao ano anterior
          </p>
          <table className="text-sm border-collapse min-w-full">
            <thead>
              <tr>
                <th className="px-3 py-2 text-left text-xs text-slate-400 border-b border-slate-100 sticky left-0 bg-white">
                  Mês
                </th>
                {controleAnual.anos.map((ano) => (
                  <th
                    key={ano}
                    colSpan={3}
                    className="px-3 py-2 text-center text-xs font-semibold text-slate-600 border-b border-l border-slate-100"
                  >
                    {ano}
                  </th>
                ))}
              </tr>
              <tr>
                <th className="border-b border-slate-100 sticky left-0 bg-white" />
                {controleAnual.anos.map((ano) => (
                  <React.Fragment key={ano}>
                    <th className="px-2 py-1 text-right text-[11px] font-normal text-slate-400 border-b border-l border-slate-100 whitespace-nowrap">
                      Mensal
                    </th>
                    <th className="px-2 py-1 text-right text-[11px] font-normal text-slate-400 border-b border-slate-100 whitespace-nowrap">
                      Acumulado
                    </th>
                    <th className="px-2 py-1 text-right text-[11px] font-normal text-slate-400 border-b border-slate-100 whitespace-nowrap">
                      % vs Ant.
                    </th>
                  </React.Fragment>
                ))}
              </tr>
            </thead>
            <tbody>
              {NOMES_MES.map((mes, i) => (
                <tr key={mes} className="border-b border-slate-50">
                  <td className="px-3 py-1.5 text-slate-600 whitespace-nowrap sticky left-0 bg-white">{mes}</td>
                  {controleAnual.anos.map((ano, ai) => {
                    const mensal = controleAnual.porAno[ano][i];
                    const acumulado = controleAnual.porAno[ano].slice(0, i + 1).reduce((a, b) => a + b, 0);
                    const anoAnterior = controleAnual.anos[ai - 1];
                    let variacao = null;
                    if (anoAnterior !== undefined) {
                      const mensalAnterior = controleAnual.porAno[anoAnterior][i];
                      if (mensalAnterior > 0) variacao = ((mensal - mensalAnterior) / mensalAnterior) * 100;
                    }
                    return (
                      <React.Fragment key={ano}>
                        <td className="px-2 py-1.5 text-right tabular-nums text-slate-600 border-l border-slate-50 whitespace-nowrap">
                          {mensal > 0 ? fmtMoeda(mensal) : "—"}
                        </td>
                        <td className="px-2 py-1.5 text-right tabular-nums text-slate-400 whitespace-nowrap">
                          {acumulado > 0 ? fmtMoeda(acumulado) : "—"}
                        </td>
                        <td className="px-2 py-1.5 text-right whitespace-nowrap">
                          {variacao !== null ? (
                            <span
                              className="text-xs font-medium"
                              style={{ color: variacao >= 0 ? "#0F8A6B" : "#C4573D" }}
                            >
                              {variacao >= 0 ? "▲" : "▼"} {Math.abs(variacao).toFixed(1)}%
                            </span>
                          ) : (
                            "—"
                          )}
                        </td>
                      </React.Fragment>
                    );
                  })}
                </tr>
              ))}
              <tr className="font-semibold bg-slate-50">
                <td className="px-3 py-2 text-slate-700 sticky left-0 bg-slate-50">TOTAL</td>
                {controleAnual.anos.map((ano, ai) => {
                  const totalAno = controleAnual.porAno[ano].reduce((a, b) => a + b, 0);
                  const anoAnterior = controleAnual.anos[ai - 1];
                  let variacao = null;
                  if (anoAnterior !== undefined) {
                    const totalAnterior = controleAnual.porAno[anoAnterior].reduce((a, b) => a + b, 0);
                    if (totalAnterior > 0) variacao = ((totalAno - totalAnterior) / totalAnterior) * 100;
                  }
                  return (
                    <React.Fragment key={ano}>
                      <td className="px-2 py-2 text-right border-l border-slate-100 whitespace-nowrap">
                        {fmtMoeda(totalAno)}
                      </td>
                      <td className="px-2 py-2 text-right whitespace-nowrap">{fmtMoeda(totalAno)}</td>
                      <td className="px-2 py-2 text-right whitespace-nowrap">
                        {variacao !== null ? (
                          <span style={{ color: variacao >= 0 ? "#0F8A6B" : "#C4573D" }}>
                            {variacao >= 0 ? "▲" : "▼"} {Math.abs(variacao).toFixed(1)}%
                          </span>
                        ) : (
                          "—"
                        )}
                      </td>
                    </React.Fragment>
                  );
                })}
              </tr>
            </tbody>
          </table>
        </div>
      )}

      <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-md px-3 py-2 max-w-md shadow-sm">
        <Search size={14} className="text-slate-400" />
        <input
          value={busca}
          onChange={(e) => setBusca(e.target.value)}
          placeholder="Buscar por nº, cliente ou descrição"
          className="bg-transparent text-sm outline-none w-full placeholder:text-slate-400"
        />
      </div>

      {/* Seletor de mês, e tabela detalhada só do mês escolhido */}
      {gruposPorMes.length === 0 && (
        <div className="bg-white rounded-xl shadow-sm p-8 text-center text-slate-400 text-sm">
          Nenhuma proposta aprovada ou bonificada encontrada.
        </div>
      )}
      {gruposPorMes.length > 0 &&
        (() => {
          const g = gruposPorMes.find((x) => x.chave === mesSelecionado) || gruposPorMes[0];
          return (
            <div className="bg-white rounded-xl shadow-sm overflow-hidden">
              <div className="px-5 py-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wide">
                    Propostas Aprovadas Mês {g.mes}/{g.ano.slice(2)}
                  </h3>
                  <div className="flex flex-wrap items-center gap-4 mt-2 text-xs text-slate-400">
                    <span className="inline-flex items-center gap-1.5">
                      <span
                        className="px-2 py-0.5 rounded-full font-medium"
                        style={{ backgroundColor: "#0F8A6B1a", color: "#0F8A6B" }}
                      >
                        Aprovado
                      </span>
                      Proposta aprovada — valores contabilizados no total
                    </span>
                    <span className="inline-flex items-center gap-1.5">
                      <span
                        className="px-2 py-0.5 rounded-full font-medium"
                        style={{ backgroundColor: "#7C3AED1a", color: "#7C3AED" }}
                      >
                        Bonificado
                      </span>
                      Proposta bonificada — valores não contabilizados no total
                    </span>
                  </div>
                </div>
                <select
                  value={g.chave}
                  onChange={(e) => setMesSelecionado(e.target.value)}
                  className="text-sm border border-slate-200 rounded-md px-3 py-2 text-slate-600 shrink-0"
                >
                  {gruposPorMes.map((opt) => (
                    <option key={opt.chave} value={opt.chave}>
                      Mês {opt.mes}/{opt.ano.slice(2)} ({opt.itens.length})
                    </option>
                  ))}
                </select>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-left text-xs text-slate-400 border-b border-slate-100">
                      <th className="px-3 py-2 font-medium">Nº</th>
                      <th className="px-3 py-2 font-medium">Cliente</th>
                      <th className="px-3 py-2 font-medium">Descrição</th>
                      <th className="px-3 py-2 font-medium">Analista</th>
                      <th className="px-3 py-2 font-medium">Proposta</th>
                      <th className="px-3 py-2 font-medium">Envio</th>
                      <th className="px-3 py-2 font-medium">Aprovação</th>
                      <th className="px-3 py-2 font-medium text-right">Valor do Projeto</th>
                      <th className="px-3 py-2 font-medium text-right">% Negociada</th>
                      <th className="px-3 py-2 font-medium text-right">Desconto</th>
                      <th className="px-3 py-2 font-medium text-right">Valor Total</th>
                      <th className="px-3 py-2 font-medium">Pagamento</th>
                    </tr>
                  </thead>
                  <tbody>
                    {g.itens.map((c) => {
                      const bonificado = c.proposta_status === "Bonificado";
                      return (
                        <tr
                          key={c.id}
                          onClick={() => onEditar && onEditar(c)}
                          className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 cursor-pointer"
                        >
                          <td className="px-3 py-2 font-mono text-xs text-slate-400">#{c.numero}</td>
                          <td className="px-3 py-2 text-slate-700 font-medium whitespace-nowrap">{c.cliente_nome}</td>
                          <td className="px-3 py-2 text-slate-500 max-w-[340px] truncate" title={c.descricao || ""}>{c.descricao || "—"}</td>
                          <td className="px-3 py-2 text-slate-500 whitespace-nowrap">{c.analista_nome || "—"}</td>
                          <td className="px-3 py-2">
                            <span
                              className="text-xs font-medium px-2 py-0.5 rounded-full whitespace-nowrap"
                              style={{
                                backgroundColor: (bonificado ? "#7C3AED" : "#0F8A6B") + "1a",
                                color: bonificado ? "#7C3AED" : "#0F8A6B",
                              }}
                            >
                              {c.proposta_status}
                            </span>
                          </td>
                          <td className="px-3 py-2 text-slate-500 whitespace-nowrap">
                            {fmtData(c.data_envio_proposta)}
                          </td>
                          <td className="px-3 py-2 text-slate-500 whitespace-nowrap">{fmtData(c.data_aprovacao)}</td>
                          <td className="px-3 py-2 text-right tabular-nums whitespace-nowrap">
                            {bonificado ? (
                              <span className="text-xs" style={{ color: "#7C3AED" }}>
                                Bonificado
                              </span>
                            ) : (
                              fmtMoeda(c.valor_projeto)
                            )}
                          </td>
                          <td className="px-3 py-2 text-right tabular-nums text-slate-500 whitespace-nowrap">
                            {fmtPct(c.pct_negociado)}
                          </td>
                          <td className="px-3 py-2 text-right tabular-nums whitespace-nowrap">
                            {bonificado ? (
                              <span className="text-xs" style={{ color: "#7C3AED" }}>
                                Bonificado
                              </span>
                            ) : (
                              <span style={{ color: "#C4573D" }}>{fmtMoeda(c.desconto_negociado)}</span>
                            )}
                          </td>
                          <td className="px-3 py-2 text-right tabular-nums font-semibold whitespace-nowrap">
                            {bonificado ? (
                              <span className="text-xs font-normal" style={{ color: "#7C3AED" }}>
                                Bonificado
                              </span>
                            ) : (
                              <div className="space-y-0.5">
                                {parcelasDe(c).map((p, i) => (
                                  <div key={i}>{fmtMoeda(p.valor)}</div>
                                ))}
                              </div>
                            )}
                          </td>
                          <td className="px-3 py-2 text-slate-500 whitespace-nowrap">
                            {bonificado ? (
                              "—"
                            ) : (
                              <div className="space-y-0.5">
                                {parcelasDe(c).map((p, i) => (
                                  <div key={i}>{p.dias} Dias</div>
                                ))}
                              </div>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                    <tr className="bg-slate-50 font-semibold">
                      <td colSpan={7} className="px-3 py-2 text-right text-slate-600">
                        TOTAL
                      </td>
                      <td className="px-3 py-2 text-right whitespace-nowrap">{fmtMoeda(g.totalProjeto)}</td>
                      <td />
                      <td className="px-3 py-2 text-right whitespace-nowrap" style={{ color: "#C4573D" }}>
                        {fmtMoeda(g.totalDesconto)}
                      </td>
                      <td className="px-3 py-2 text-right whitespace-nowrap">{fmtMoeda(g.totalValorTotal)}</td>
                      <td />
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          );
        })()}
    </div>
  );
}

function ValoresMargemPage({ chamados, onEditar }) {
  const [busca, setBusca] = useState("");

  const valorProjetoTotal = useMemo(
    () => chamados.reduce((s, c) => s + Number(c.valor_projeto || 0), 0),
    [chamados]
  );
  const descontoTotal = useMemo(
    () => chamados.reduce((s, c) => s + Number(c.desconto_negociado || 0), 0),
    [chamados]
  );
  const valorRecebido = useMemo(
    () => chamados.reduce((s, c) => s + Number(c.valor_total_projeto || 0), 0),
    [chamados]
  );
  const margemMedia = useMemo(() => {
    const comHoras = chamados.filter((c) => Number(c.horas_dev) > 0);
    if (!comHoras.length) return 0;
    return comHoras.reduce((s, c) => s + Number(c.pct_margem || 0), 0) / comHoras.length;
  }, [chamados]);

  const valorPorMes = useMemo(() => {
    const nomesMes = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
    const anoFoco = new Date().getFullYear();
    const valores = Array(12).fill(0);
    chamados.forEach((c) => {
      if (!c.data_abertura) return;
      const d = parseDataLocal(c.data_abertura);
      if (d.getFullYear() === anoFoco) valores[d.getMonth()] += Number(c.valor_total_projeto || 0);
    });
    let ultimoMes = 0;
    valores.forEach((v, i) => {
      if (v > 0) ultimoMes = i;
    });
    return nomesMes.slice(0, ultimoMes + 1).map((mes, i) => ({ mes, valor: Math.round(valores[i]) }));
  }, [chamados]);

  const topClientesValor = useMemo(() => {
    const contagem = {};
    chamados.forEach((c) => {
      contagem[c.cliente_nome] = (contagem[c.cliente_nome] || 0) + Number(c.valor_total_projeto || 0);
    });
    return Object.entries(contagem)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8)
      .map(([nome, valor]) => ({ nome, valor: Math.round(valor) }));
  }, [chamados]);

  const filtrados = useMemo(() => {
    return chamados
      .filter(
        (c) =>
          !busca.trim() ||
          `${c.numero} ${c.cliente_nome} ${c.descricao || ""}`.toLowerCase().includes(busca.trim().toLowerCase())
      )
      .sort((a, b) => Number(b.valor_total_projeto || 0) - Number(a.valor_total_projeto || 0))
      .slice(0, 100);
  }, [chamados, busca]);

  const fmtMoeda = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const fmtPct = (v) => `${Math.round(Number(v || 0) * 100)}%`;

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <KpiCard label="Valor Total dos Projetos" value={fmtMoeda(valorProjetoTotal)} accent="#0F172A" />
        <KpiCard label="Desconto Negociado" value={fmtMoeda(descontoTotal)} accent="#C4573D" />
        <KpiCard label="Valor Recebido" value={fmtMoeda(valorRecebido)} accent="#0F8A6B" />
        <KpiCard label="Margem Média" value={fmtPct(margemMedia)} accent="#7C3AED" />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="bg-white border border-slate-200 rounded-lg p-5">
          <h2 className="text-sm font-semibold text-slate-800 mb-4">
            Valor Recebido por Mês · {new Date().getFullYear()}
          </h2>
          <ResponsiveContainer width="100%" height={220}>
            <LineChart data={valorPorMes}>
              <CartesianGrid stroke="#EEF0EC" vertical={false} />
              <XAxis dataKey="mes" tick={{ fontSize: 12, fill: "#94a3b8" }} axisLine={false} tickLine={false} />
              <YAxis
                tick={{ fontSize: 11, fill: "#94a3b8" }}
                axisLine={false}
                tickLine={false}
                tickFormatter={(v) => `${Math.round(v / 1000)}k`}
              />
              <Tooltip formatter={(v) => fmtMoeda(v)} />
              <Line type="monotone" dataKey="valor" stroke={BRAND_BLUE} strokeWidth={2.5} dot={{ r: 3 }} />
            </LineChart>
          </ResponsiveContainer>
        </div>

        <div className="bg-white border border-slate-200 rounded-lg p-5">
          <h2 className="text-sm font-semibold text-slate-800 mb-4">Top Clientes por Valor</h2>
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={topClientesValor} layout="vertical" margin={{ left: 10 }}>
              <XAxis type="number" hide />
              <YAxis
                dataKey="nome"
                type="category"
                width={90}
                tick={{ fontSize: 11, fill: "#475569" }}
                axisLine={false}
                tickLine={false}
              />
              <Tooltip formatter={(v) => fmtMoeda(v)} />
              <Bar dataKey="valor" fill="#E0A526" radius={[0, 4, 4, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-md px-3 py-2 max-w-md shadow-sm">
        <Search size={14} className="text-slate-400" />
        <input
          value={busca}
          onChange={(e) => setBusca(e.target.value)}
          placeholder="Buscar por nº, cliente ou descrição"
          className="bg-transparent text-sm outline-none w-full placeholder:text-slate-400"
        />
      </div>

      <div className="bg-white rounded-xl shadow-sm overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-xs text-slate-400 border-b border-slate-100">
                <th className="px-4 py-3 font-medium">Nº</th>
                <th className="px-4 py-3 font-medium">Cliente</th>
                <th className="px-4 py-3 font-medium text-right">% Margem</th>
                <th className="px-4 py-3 font-medium text-right">Valor do Projeto</th>
                <th className="px-4 py-3 font-medium text-right">Desconto</th>
                <th className="px-4 py-3 font-medium text-right">Valor Total</th>
              </tr>
            </thead>
            <tbody>
              {filtrados.map((c) => (
                <tr
                  key={c.id}
                  onClick={() => onEditar && onEditar(c)}
                  className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 cursor-pointer"
                >
                  <td className="px-4 py-2.5 font-mono text-xs text-slate-400">#{c.numero}</td>
                  <td className="px-4 py-2.5 text-slate-700 font-medium whitespace-nowrap">{c.cliente_nome}</td>
                  <td className="px-4 py-2.5 text-right tabular-nums text-slate-600 whitespace-nowrap">
                    {fmtPct(c.pct_margem)}
                  </td>
                  <td className="px-4 py-2.5 text-right tabular-nums text-slate-600 whitespace-nowrap">
                    {fmtMoeda(c.valor_projeto)}
                  </td>
                  <td className="px-4 py-2.5 text-right tabular-nums text-[#C4573D] whitespace-nowrap">

    [chamados]
  );

  const diasAguardando = (data) => {
    if (!data) return null;
    return Math.floor((Date.now() - parseDataLocal(data).getTime()) / (1000 * 60 * 60 * 24));
  };

  const filtradas = useMemo(() => {
    return propostas
      .filter(
        (c) =>
          !busca.trim() ||
          `${c.numero} ${c.cliente_nome} ${c.descricao || ""}`.toLowerCase().includes(busca.trim().toLowerCase())
      )
      .sort((a, b) => parseDataLocal(a.data_envio_proposta || a.data_abertura) - parseDataLocal(b.data_envio_proposta || b.data_abertura));
  }, [propostas, busca]);

  const valorTotal = useMemo(() => propostas.reduce((s, c) => s + Number(c.valor_total_projeto || 0), 0), [propostas]);

  const diasMaximo = useMemo(() => {
    const dias = propostas.map((c) => diasAguardando(c.data_envio_proposta)).filter((d) => d !== null);
    return dias.length ? Math.max(...dias) : 0;
  }, [propostas]);

  const fmtMoeda = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  const corDias = (dias) => {

        <KpiCard label="Valor Total em Aberto" value={fmtMoeda(valorTotal)} accent="#0F8A6B" />
        <KpiCard label="Mais Antiga (dias)" value={diasMaximo} accent="#E0A526" />
      </div>

      <p className="text-xs text-slate-400 -mt-2">
        Chamados já <strong>concluídos</strong> cuja proposta foi <strong>enviada</strong> mas ainda não voltou como
        aprovada, recusada ou cancelada.

      <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-md px-3 py-2 max-w-md shadow-sm">
        <Search size={14} className="text-slate-400" />
        <input
          value={busca}
          onChange={(e) => setBusca(e.target.value)}
          placeholder="Buscar por nº, cliente ou descrição"

      <div className="bg-white rounded-xl shadow-sm overflow-hidden">
        <div className="overflow-x-auto">

                <th className="px-4 py-3 font-medium">Analista</th>

function CargaPorAnalistaPage({ chamados, analistas, onEditar }) {
  const [busca, setBusca] = useState("");
  const [expandido, setExpandido] = useState(null);

  const analistasAtivos = useMemo(() => analistas.filter((a) => a.ativo !== false), [analistas]);
  const nomesAtivos = useMemo(() => new Set(analistasAtivos.map((a) => a.nome)), [analistasAtivos]);

  const STATUS_ABERTOS = ["A Iniciar", "Em Analise", "BackLog", "Aguard. Retorno do Cliente", "Aguard. Analise Desen.", "Aguard. Horas de Desen.", "Reunião Tecnica", "Enviar Proposta", "Novo Cliente"];

  const porAnalista = useMemo(() => {
    const grupos = {};
    chamados.forEach((c) => {
      const nome = c.analista_nome || "Sem analista";
      if (!nomesAtivos.has(nome)) return; // so mostra quem esta marcado como ativo
      // Chamado ja Concluido so continua contando na carga se a proposta ainda estiver
      // em aberto (vazia ou Enviado) - se ja foi Aprovado/Bonificado/Negado/etc, o
      // trabalho comercial ja foi decidido e nao deveria pesar mais na carga do analista.
      if (c.status === "Concluido" && c.proposta_status && c.proposta_status !== "Enviado") return;
      if (!grupos[nome]) grupos[nome] = [];
      grupos[nome].push(c);
    });
    return Object.entries(grupos)
      .map(([nome, itens]) => {
        const statusCount = {};
        itens.forEach((i) => {
          statusCount[i.status] = (statusCount[i.status] || 0) + 1;
        });
        const abertos = itens.filter((i) => STATUS_ABERTOS.includes(i.status)).length;
        const totalHoras = itens.reduce((s, i) => s + Number(i.total_horas || 0), 0);
        return {
          nome,
          itens: itens.sort((a, b) => parseDataLocal(b.data_abertura) - parseDataLocal(a.data_abertura)),
          total: itens.length,
          abertos,
          totalHoras,
          statusCount,
        };
      })
      .filter((g) => !busca.trim() || g.nome.toLowerCase().includes(busca.trim().toLowerCase()))
      .sort((a, b) => b.abertos - a.abertos);
  }, [chamados, busca, nomesAtivos]);

  const chamadosAbertos = useMemo(() => chamados.filter((c) => STATUS_ABERTOS.includes(c.status)).length, [chamados]);

  const fmtData = (d) => (d ? parseDataLocal(d).toLocaleDateString("pt-BR") : "—");

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <KpiCard label="Analistas Ativos" value={analistasAtivos.length} accent="#0F172A" />
        <KpiCard label="Chamados em Aberto" value={chamadosAbertos} accent="#3A6EA5" />
        <KpiCard
          label="Média por Analista"
          value={analistasAtivos.length ? Math.round(chamadosAbertos / analistasAtivos.length) : 0}
          accent="#7C3AED"
        />
      </div>

      <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-md px-3 py-2 max-w-md shadow-sm">
        <Search size={14} className="text-slate-400" />
        <input
          value={busca}
          onChange={(e) => setBusca(e.target.value)}
          placeholder="Buscar analista"
          className="bg-transparent text-sm outline-none w-full placeholder:text-slate-400"
        />
      </div>

      <div className="space-y-2">
        {porAnalista.length === 0 && (
          <div className="bg-white rounded-xl shadow-sm p-8 text-center text-slate-400 text-sm">
            Nenhum analista encontrado.
          </div>
        )}
        {porAnalista.map((g) => {
          const aberto = expandido === g.nome;
          return (
            <div key={g.nome} className="bg-white rounded-xl shadow-sm overflow-hidden">
              <button
                onClick={() => setExpandido(aberto ? null : g.nome)}
                className="w-full flex items-center justify-between px-5 py-4 hover:bg-slate-50/60"
              >
                <div className="flex items-center gap-3">
                  <ChevronRight
                    size={16}
                    className={`text-slate-400 transition-transform ${aberto ? "rotate-90" : "rotate-0"}`}
                  />
                  <span className="font-semibold text-slate-800">{g.nome}</span>
                  {!nomesAtivos.has(g.nome) && (
                    <span className="text-[10px] font-medium px-1.5 py-0.5 rounded bg-slate-100 text-slate-400">
                      inativo
                    </span>
                  )}
                  <span
                    className="text-xs font-medium px-2 py-0.5 rounded-full"
                    style={{ backgroundColor: BRAND_BLUE + "1a", color: BRAND_BLUE }}
                  >
                    {g.abertos} em aberto
                  </span>
                  <span className="text-xs text-slate-400">{g.total} no total</span>
                </div>
                <span className="text-xs text-slate-500 tabular-nums">{Math.round(g.totalHoras)}h somadas</span>
              </button>

              <div className="px-5 pb-3 flex flex-wrap gap-1.5">
                {Object.entries(g.statusCount).map(([status, qtd]) => (
                  <span
                    key={status}
                    className="text-[11px] font-medium px-2 py-0.5 rounded-full"
                    style={{ backgroundColor: corStatus(status) + "1a", color: corStatus(status) }}
                  >
                    {status} · {qtd}
                  </span>
                ))}
              </div>

              {aberto && (
                <div className="border-t border-slate-100">
                  {g.itens.map((c) => (
                    <div
                      key={c.id}
                      onClick={() => onEditar && onEditar(c)}
                      className="flex items-center justify-between px-5 py-2.5 border-b border-slate-50 last:border-0 hover:bg-slate-50/60 cursor-pointer"
                    >
                      <div className="flex items-center gap-3 min-w-0">
                        <span className="font-mono text-xs text-slate-400 shrink-0">#{c.numero}</span>
                        <span className="text-sm text-slate-700 font-medium shrink-0">{c.cliente_nome}</span>
                        <span className="text-sm text-slate-500 truncate" title={c.descricao || ""}>{c.descricao || "—"}</span>
                      </div>
                      <div className="flex items-center gap-4 shrink-0">
                        <span className="text-xs text-slate-400">{fmtData(c.data_abertura)}</span>
                        <span
                          className="text-xs font-medium px-2 py-0.5 rounded-full"
                          style={{ backgroundColor: corStatus(c.status) + "1a", color: corStatus(c.status) }}
                        >
                          {c.status}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}
