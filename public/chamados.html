<div id="root">
  <div id="carregando-inicial" style="font-family: sans-serif; color: #888; padding: 40px; text-align: center;">
    Carregando o painel...
  </div>
</div>

<script>
  // Diagnóstico automático: depois de alguns segundos, verifica quais
  // bibliotecas realmente carregaram e aponta exatamente qual falhou.
  setTimeout(function () {
    var placeholder = document.getElementById("carregando-inicial");
    if (!placeholder) return; // React já montou normalmente, nada a fazer

    var checagens = [
      ["React", typeof React !== "undefined"],
      ["ReactDOM", typeof ReactDOM !== "undefined"],
      ["PropTypes", typeof PropTypes !== "undefined"],
      ["Recharts", typeof Recharts !== "undefined"],
      ["Babel", typeof Babel !== "undefined"],
    ];
    var falhou = checagens.filter(function (c) { return !c[1]; }).map(function (c) { return c[0]; });

    var linhas = checagens.map(function (c) {
      var cor = c[1] ? "#15803d" : "#b91c1c";
      var status = c[1] ? "OK" : "NÃO CARREGOU";
      return '<div style="color:' + cor + '; font-family: monospace; margin: 4px 0;">' + c[0] + ": " + status + "</div>";
    }).join("");

    var mensagemFinal;
    if (falhou.length > 0) {
      mensagemFinal =
        '<p><strong>Não carregou:</strong> ' + falhou.join(", ") + '.</p>' +
        '<p>Isso costuma ser a internet/firewall bloqueando o domínio unpkg.com (de onde essas bibliotecas vêm). ' +
        'Tente em outra rede (ex: dados do celular) ou peça para o time de TI liberar unpkg.com.</p>';
    } else {
      mensagemFinal =
        '<p>Todas as bibliotecas carregaram, então o problema está em outro lugar (provavelmente a conexão com o Supabase). ' +
        'Abra o Console (F12 → aba Console) e procure uma linha vermelha — ela deve mencionar "supabase" ou "fetch".</p>';
    }

    document.getElementById("root").innerHTML =
      '<div style="font-family: sans-serif; color: #1e293b; padding: 40px; max-width: 700px; margin: 0 auto;">' +
      '<h2 style="color:#b91c1c;">O painel não terminou de carregar</h2>' +
      '<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:16px; margin: 16px 0;">' + linhas + '</div>' +
      mensagemFinal +
      '</div>';
  }, 4000);
</script>

// -----------------------------------------------------------------------
// Conexão com o backend do painel de Projetos (rotas /api/chamados-*),
// protegidas pela senha única do Chamados (igual ao Admin). A senha vem do
// sessionStorage, guardada na hora que a pessoa clicou em "Chamados" no menu.
// -----------------------------------------------------------------------
const CHAMADOS_PASSWORD = sessionStorage.getItem("chamadosPassword");

if (!CHAMADOS_PASSWORD) {
  // ninguém deveria chegar aqui sem passar pelo menu do painel de Projetos
  window.location.href = "/";

// Traduz as chamadas no formato antigo (estilo Supabase/PostgREST) para as
// rotas novas do Express. Mantém a mesma assinatura de função (sbFetch) pra
// não precisar mexer em cada chamada espalhada pelo código abaixo.
async function sbFetch(caminhoAntigo, options = {}) {
  const [base, query] = caminhoAntigo.split("?");
  const method = (options.method || "GET").toUpperCase();

  let url;
  if (base === "/chamados_calculado") {
    url = "/api/chamados";
  } else if (base === "/clientes") {
    url = "/api/chamados-clientes";
  } else if (base === "/analistas") {
    const idMatch = query && query.match(/id=eq\.([\w-]+)/);
    url = idMatch ? `/api/chamados-analistas/${idMatch[1]}` : "/api/chamados-analistas";
  } else if (base === "/config_calculo") {
    const idMatch = query && query.match(/id=eq\.([\w-]+)/);
    url = idMatch ? `/api/chamados-config/${idMatch[1]}` : "/api/chamados-config";
  } else if (base === "/status_ocultos") {
    if (method === "DELETE") {
      const statusMatch = (query || "").match(/status=eq\.(.+)/);
      url = `/api/chamados-status-ocultos?status=${statusMatch ? statusMatch[1] : ""}`;
    } else {
      url = "/api/chamados-status-ocultos";
    }
  } else if (base === "/chamados") {
    const idMatch = query && query.match(/id=eq\.([\w-]+)/);
    url = idMatch ? `/api/chamados/${idMatch[1]}` : "/api/chamados";
  } else {
    url = "/api" + base;
  }

  const res = await fetch(url, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "x-chamados-password": CHAMADOS_PASSWORD,
      ...(options.headers || {}),
    },
  });

  if (res.status === 401) {
    sessionStorage.removeItem("chamadosPassword");
    alert("Sessão do Chamados expirou ou senha inválida. Você será redirecionado.");
    window.location.href = "/";
    throw new Error("nao autorizado");
  }

  if (!res.ok) {
    const texto = await res.text().catch(() => "");
    throw new Error(`Erro ${res.status}: ${texto || res.statusText}`);
  }
  const tipo = res.headers.get("content-type") || "";
  return tipo.includes("application/json") ? res.json() : null;
}

const CORES_STATUS = {

// O Supabase devolve datas "puras" como texto "AAAA-MM-DD". Se passarmos isso
// direto pro `parseDataLocal(...)`, o JS interpreta como meia-noite em UTC — e como
// o Brasil está em UTC-3, a data exibida/agrupada acaba caindo no dia (ou mês)
// anterior. Esta função monta a data em horário local, evitando esse desvio.
function parseDataLocal(valor) {
  if (!valor) return null;
  if (valor instanceof Date) return valor;
  const partes = String(valor).slice(0, 10).split("-");
  if (partes.length === 3) {
    const [ano, mes, dia] = partes.map(Number);
    return new Date(ano, mes - 1, dia);
  }
  return new Date(valor);
}

// -----------------------------------------------------------------------
// Regra de cálculo (confirmada a partir dos dados reais da planilha)
// -----------------------------------------------------------------------
const CONFIG_PADRAO = { pctQA: 0.6, pctGerencial: 0.2, valorHora: 162.94 };

// Arredondamento ABNT NBR 5891: quando o algarismo a descartar é exatamente 5
// (sem mais nada depois), arredonda para o número par mais próximo; senão,
// segue a regra comum (< 5 mantém, > 5 sobe).
function arredondarABNT(valor, casas = 1) {
  if (valor === null || valor === undefined || isNaN(valor)) return valor;
  const fator = Math.pow(10, casas);
  const numero = valor * fator;
  const piso = Math.floor(numero);
  const diferenca = numero - piso;
  const EPS = 1e-9;
  let resultado;
  if (diferenca > 0.5 + EPS) {
    resultado = piso + 1;
  } else if (diferenca < 0.5 - EPS) {
    resultado = piso;
  } else {
    resultado = piso % 2 === 0 ? piso : piso + 1;
  }
  return resultado / fator;
}

function calcularChamado({ horasDev, pctMargem, pctNegociado, config }) {
  const cfg = config || CONFIG_PADRAO;
  const dev = Number(horasDev) || 0;
  const qa = arredondarABNT(dev * cfg.pctQA, 0);
  const gerencial = arredondarABNT(dev * cfg.pctGerencial, 0);
  const totalHoras = arredondarABNT(dev + qa + gerencial, 0);
  const horasMargem = arredondarABNT(totalHoras * (Number(pctMargem) || 0), 0);
  const totalGeral = arredondarABNT(totalHoras + horasMargem, 0);
  const valorProjeto = totalGeral * cfg.valorHora;
  const descontoNegociado = valorProjeto * (Number(pctNegociado) || 0);
  const valorTotalProjeto = valorProjeto - descontoNegociado;
  return { qa, gerencial, totalHoras, horasMargem, totalGeral, valorProjeto, descontoNegociado, valorTotalProjeto };
}

const OPCOES_STATUS = [
  "A Iniciar", "Em Analise", "BackLog", "Concluido", "Encerrado", "Cancelado",
  "Enviar Proposta", "Aguard. Retorno do Cliente", "Aguard. Analise Desen.",
  "Aguard. Horas de Desen.", "Reunião Tecnica", "Novo Cliente",
];

const OPCOES_PROPOSTA = [
  "", "Aprovado", "Enviado", "Bonificado", "Cancelado", "Encerrado",
  "Release", "Suporte", "Recusada", "Equipe Exclusiva", "Negada",
];

function ChamadoFormModal({ aberto, onFechar, onSalvar, salvando, onExcluir, excluindo, config, analistas, chamadoExistente }) {
  const editando = !!chamadoExistente;

  const [cliente, setCliente] = useState("");
  const [numero, setNumero] = useState("");
  const [descricao, setDescricao] = useState("");
  const [analista, setAnalista] = useState("");
  const [status, setStatus] = useState("A Iniciar");
  const [grupoTrabalho, setGrupoTrabalho] = useState("");
  const [complexidade, setComplexidade] = useState("");
  const [propostaStatus, setPropostaStatus] = useState("");
  const [dataEnvioProposta, setDataEnvioProposta] = useState("");
  const [dataAprovacao, setDataAprovacao] = useState("");
  const [horasDev, setHorasDev] = useState("");
  const [pctMargem, setPctMargem] = useState("10");
  const [pctNegociado, setPctNegociado] = useState("0");
  const [qtdParcelas, setQtdParcelas] = useState("1");
  const [projetoFechado, setProjetoFechado] = useState(false);

  useEffect(() => {
    if (!aberto) return;
    if (chamadoExistente) {
      setCliente(chamadoExistente.cliente_nome || "");
      setNumero(String(chamadoExistente.numero ?? ""));
      setDescricao(chamadoExistente.descricao || "");
      setAnalista(chamadoExistente.analista_nome || "");
      setStatus(chamadoExistente.status || "A Iniciar");
      setGrupoTrabalho(chamadoExistente.grupo_trabalho || "");
      setComplexidade(chamadoExistente.complexidade || "");
      setPropostaStatus(chamadoExistente.proposta_status || "");
      setDataEnvioProposta(chamadoExistente.data_envio_proposta || "");
      setDataAprovacao(chamadoExistente.data_aprovacao || "");
      setHorasDev(String(chamadoExistente.horas_dev ?? ""));
      setPctMargem(String(Number(chamadoExistente.pct_margem || 0) * 100));
      setPctNegociado(String(Number(chamadoExistente.pct_negociado || 0) * 100));
      setQtdParcelas(String(chamadoExistente.qtd_parcelas || 1));
      setProjetoFechado(
        Number(chamadoExistente.pct_qa_aplicado || 0) === 0 && Number(chamadoExistente.pct_gerencial_aplicado || 0) === 0
      );
    } else {
      setCliente("");
      setNumero("");
      setDescricao("");
      setAnalista(analistas[0]?.nome || "");
      setStatus("A Iniciar");
      setGrupoTrabalho("");
      setComplexidade("");
      setPropostaStatus("");
      setDataEnvioProposta("");
      setDataAprovacao("");
      setHorasDev("");
      setPctMargem("10");
      setPctNegociado("0");
      setQtdParcelas("1");
      setProjetoFechado(false);
    }
  }, [aberto, chamadoExistente]);

  if (!aberto) return null;

  // no modo edição, usa a régua que estava salva NAQUELE chamado (não a atual);
  // no modo criação, usa a régua vigente agora
  const cfgCalculoBase = editando
    ? {
        pctQA: Number(chamadoExistente.pct_qa_aplicado),
        pctGerencial: Number(chamadoExistente.pct_gerencial_aplicado),
        valorHora: Number(chamadoExistente.valor_hora_aplicado),
      }
    : config;

  // "projeto fechado" = horas já vêm prontas (ex: alocação de recursos), sem QA/Gerencial
  const cfgCalculo = projetoFechado ? { ...cfgCalculoBase, pctQA: 0, pctGerencial: 0 } : cfgCalculoBase;

  const calc = calcularChamado({
    horasDev,
    pctMargem: Number(pctMargem) / 100,
    pctNegociado: Number(pctNegociado) / 100,
    config: cfgCalculo,
  });
  const fmt = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  const fmtMoeda = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  const podeSalvar = cliente.trim() && Number(horasDev) >= 0 && numero && Number(numero) > 0;

  function handleSalvar() {
    onSalvar({
      id: chamadoExistente?.id,
      numero: Number(numero),
      cliente,
      descricao,
      analista,
      status,
      grupoTrabalho,
      complexidade,
      propostaStatus,
      dataEnvioProposta: dataEnvioProposta || null,
      dataAprovacao: dataAprovacao || null,
      horasDev: Number(horasDev),
      pctMargem: Number(pctMargem) / 100,
      pctNegociado: Number(pctNegociado) / 100,
      qtdParcelas: Number(qtdParcelas),
      pctQaAplicado: cfgCalculo.pctQA,
      pctGerencialAplicado: cfgCalculo.pctGerencial,
      valorHoraAplicado: cfgCalculo.valorHora,
    });
  }

  return (
    <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto shadow-xl">
        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h2 className="text-base font-semibold text-slate-900" style={{ fontFamily: "'Poppins', sans-serif" }}>
            {editando ? `Editar Chamado #${chamadoExistente.numero}` : "Novo Chamado"}
          </h2>
          <button onClick={onFechar} className="text-slate-400 hover:text-slate-600">
            <X size={18} />
          </button>
        </div>

        <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
          {/* Campos manuais */}
          <div className="space-y-4">
            <div className="grid grid-cols-3 gap-3">
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Nº do chamado</label>
                <input

function MultiSelectFiltro({ label, opcoes, selecionados, onChange }) {
  const [aberto, setAberto] = useState(false);
  const ref = React.useRef(null);

  useEffect(() => {
    function fecharFora(e) {
      if (ref.current && !ref.current.contains(e.target)) setAberto(false);
    }
    document.addEventListener("mousedown", fecharFora);
    return () => document.removeEventListener("mousedown", fecharFora);
  }, []);

  function toggle(opcao) {
    if (selecionados.includes(opcao)) {
      onChange(selecionados.filter((o) => o !== opcao));
    } else {
      onChange([...selecionados, opcao]);
    }
  }

  const texto = selecionados.length === 0 ? label : `${label} (${selecionados.length})`;

  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setAberto((v) => !v)}
        className="text-sm border border-slate-200 rounded-md px-3 py-2 text-slate-600 flex items-center gap-2 bg-white"
      >
        {texto}
        <ChevronRight size={12} className={`transition-transform ${aberto ? "rotate-90" : "rotate-0"} text-slate-400`} />
      </button>
      {aberto && (
        <div className="absolute z-20 mt-1 w-56 max-h-64 overflow-y-auto bg-white border border-slate-200 rounded-md shadow-lg py-1">
          {selecionados.length > 0 && (
            <button
              onClick={() => onChange([])}
              className="w-full text-left px-3 py-1.5 text-xs text-slate-400 hover:bg-slate-50"
            >
              Limpar seleção
            </button>
          )}
          {opcoes.map((op) => (
            <label
              key={op}
              className="flex items-center gap-2 px-3 py-1.5 text-sm text-slate-600 hover:bg-slate-50 cursor-pointer"
            >
              <input type="checkbox" checked={selecionados.includes(op)} onChange={() => toggle(op)} />
              {op}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

function AprovadasPorMesPage({ chamados, onEditar }) {
  const [busca, setBusca] = useState("");
  const [mesSelecionado, setMesSelecionado] = useState(null);

  const NOMES_MES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

  const fmtMoeda = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const fmtPct = (v) => `${(Number(v || 0) * 100).toFixed(2)}%`;
  const fmtData = (d) => (d ? parseDataLocal(d).toLocaleDateString("pt-BR") : "—");

  const PRAZOS_PARCELA = [15, 30, 60, 90];
  function parcelasDe(c) {
    const qtd = Math.min(Math.max(Number(c.qtd_parcelas) || 1, 1), 4);
    const valorParcela = Number(c.valor_total_projeto || 0) / qtd;
    return PRAZOS_PARCELA.slice(0, qtd).map((dias) => ({ dias, valor: valorParcela }));
  }

  // "relevantes" = tudo que é Aprovado ou Bonificado (aparece nas tabelas mensais);
  // só o Aprovado entra nos totais e nos KPIs (Bonificado é registrado mas não conta valor).
  const relevantes = useMemo(() => {
    const alvo = chamados.filter((c) => c.proposta_status === "Aprovado" || c.proposta_status === "Bonificado");
    if (!busca.trim()) return alvo;
    const termo = busca.trim().toLowerCase();
    return alvo.filter((c) => `${c.numero} ${c.cliente_nome} ${c.descricao || ""}`.toLowerCase().includes(termo));
  }, [chamados, busca]);

  const aprovadas = useMemo(() => relevantes.filter((c) => c.proposta_status === "Aprovado"), [relevantes]);

  const valorTotal = useMemo(
    () => aprovadas.reduce((s, c) => s + Number(c.valor_total_projeto || 0), 0),
    [aprovadas]
  );
  const ticketMedio = aprovadas.length ? valorTotal / aprovadas.length : 0;

  const porMesGrafico = useMemo(() => {
    const anoFoco = new Date().getFullYear();
    const contagem = Array(12).fill(0);
    const valores = Array(12).fill(0);
    aprovadas.forEach((c) => {
      const dataRef = c.data_aprovacao || c.data_abertura;
      if (!dataRef) return;
      const d = parseDataLocal(dataRef);
      if (d.getFullYear() === anoFoco) {
        contagem[d.getMonth()]++;
        valores[d.getMonth()] += Number(c.valor_total_projeto || 0);
      }
    });
    let ultimoMes = 0;
    contagem.forEach((v, i) => {
      if (v > 0) ultimoMes = i;
    });
    return NOMES_MES.slice(0, ultimoMes + 1).map((mes, i) => ({
      mes,
      aprovadas: contagem[i],
      valor: Math.round(valores[i]),
    }));
  }, [aprovadas]);

  // agrupa Aprovado + Bonificado por mês/ano de aprovação (com fallback pra envio/abertura)
  const gruposPorMes = useMemo(() => {
    const mapa = {};
    relevantes.forEach((c) => {
      const dataRef = c.data_aprovacao || c.data_envio_proposta || c.data_abertura;
      if (!dataRef) return;
      const d = parseDataLocal(dataRef);
      const chave = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      if (!mapa[chave]) mapa[chave] = [];
      mapa[chave].push(c);
    });
    return Object.entries(mapa)
      .sort((a, b) => b[0].localeCompare(a[0]))
      .map(([chave, itens]) => {
        const [ano, mes] = chave.split("-");
        const soAprovados = itens.filter((i) => i.proposta_status === "Aprovado");
        return {
          chave,
          ano,
          mes,
          itens: itens.sort(
            (a, b) =>
              parseDataLocal(a.data_aprovacao || a.data_abertura) - parseDataLocal(b.data_aprovacao || b.data_abertura)
          ),
          totalProjeto: soAprovados.reduce((s, i) => s + Number(i.valor_projeto || 0), 0),
          totalDesconto: soAprovados.reduce((s, i) => s + Number(i.desconto_negociado || 0), 0),
          totalValorTotal: soAprovados.reduce((s, i) => s + Number(i.valor_total_projeto || 0), 0),
        };
      });
  }, [relevantes]);

  // Controle Anual de Vendas: usa a MESMA base das tabelas "Aprovadas por Mês" —
  // só chamados com proposta Aprovado, somados pela data de aprovação (com
  // fallback pra envio/abertura) — pra bater com o total de cada mês lá em baixo.
  // Usa "chamados" direto (não "aprovadas"), pra não encolher quando alguém
  // usa a busca da página — o Controle Anual é sempre a visão geral, sem filtro.
  // (a partir de 2023, pra caber na tela sem precisar arrastar demais)
  const controleAnual = useMemo(() => {
    const ANO_MINIMO = 2023;
    const porAno = {};
    chamados
      .filter((c) => c.proposta_status === "Aprovado")
      .forEach((c) => {
        const dataRef = c.data_aprovacao || c.data_envio_proposta || c.data_abertura;
        if (!dataRef) return;
        const d = parseDataLocal(dataRef);
        const ano = d.getFullYear();
        if (ano < ANO_MINIMO) return;
        if (!porAno[ano]) porAno[ano] = Array(12).fill(0);
        porAno[ano][d.getMonth()] += Number(c.valor_total_projeto || 0);
      });
    const anos = Object.keys(porAno)
      .map(Number)
      .sort((a, b) => a - b);
    return { anos, porAno };
  }, [chamados]);

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap gap-4">
        <KpiCard label="Propostas Aprovadas" value={aprovadas.length} sub="Todos os períodos" accent="#0F172A" />
        <KpiCard label="Valor Total Aprovado" value={fmtMoeda(valorTotal)} sub="Todos os períodos" accent="#0F8A6B" />
        <KpiCard label="Ticket Médio" value={fmtMoeda(ticketMedio)} sub="Todos os períodos" accent="#7C3AED" />
      </div>

      <div className="bg-white border border-slate-200 rounded-lg p-5">
        <h2 className="text-sm font-semibold text-slate-800 mb-4">Aprovadas por Mês · {new Date().getFullYear()}</h2>
        <ResponsiveContainer width="100%" height={220}>
          <BarChart data={porMesGrafico} margin={{ top: 24 }}>
            <CartesianGrid stroke="#EEF0EC" vertical={false} />
            <XAxis dataKey="mes" tick={{ fontSize: 12, fill: "#94a3b8" }} axisLine={false} tickLine={false} />
            <YAxis tick={{ fontSize: 12, fill: "#94a3b8" }} axisLine={false} tickLine={false} />
            <Tooltip formatter={(v, nome) => (nome === "aprovadas" ? [v, "Aprovadas"] : [fmtMoeda(v), "Valor"])} />
            <Bar dataKey="aprovadas" fill="#0F8A6B" radius={[4, 4, 0, 0]}>
              <LabelList dataKey="valor" position="top" formatter={(v) => (v > 0 ? `R$ ${(v / 1000).toFixed(1)}k` : "")} style={{ fontSize: 11, fill: "#475569" }} />
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>

      {/* Controle Anual de Vendas */}
      {controleAnual.anos.length > 0 && (
        <div className="bg-white border border-slate-200 rounded-lg p-5 overflow-x-auto">
          <h2 className="text-sm font-semibold text-slate-800 mb-1">Controle Anual de Vendas</h2>
          <p className="text-xs text-slate-400 mb-4">
            Valores mensais, acumulados e variação % em relação ao ano anterior
          </p>
          <table className="text-sm border-collapse min-w-full">
            <thead>
              <tr>
                <th className="px-3 py-2 text-left text-xs text-slate-400 border-b border-slate-100 sticky left-0 bg-white">
                  Mês
                </th>
                {controleAnual.anos.map((ano) => (
                  <th
                    key={ano}
                    colSpan={3}
                    className="px-3 py-2 text-center text-xs font-semibold text-slate-600 border-b border-l border-slate-100"
                  >
                    {ano}
                  </th>
                ))}
              </tr>
              <tr>
                <th className="border-b border-slate-100 sticky left-0 bg-white" />
                {controleAnual.anos.map((ano) => (
                  <React.Fragment key={ano}>
                    <th className="px-2 py-1 text-right text-[11px] font-normal text-slate-400 border-b border-l border-slate-100 whitespace-nowrap">
                      Mensal
                    </th>
                    <th className="px-2 py-1 text-right text-[11px] font-normal text-slate-400 border-b border-slate-100 whitespace-nowrap">
                      Acumulado
                    </th>
                    <th className="px-2 py-1 text-right text-[11px] font-normal text-slate-400 border-b border-slate-100 whitespace-nowrap">
                      % vs Ant.
                    </th>
                  </React.Fragment>
                ))}
              </tr>
            </thead>
            <tbody>
              {NOMES_MES.map((mes, i) => (
                <tr key={mes} className="border-b border-slate-50">
                  <td className="px-3 py-1.5 text-slate-600 whitespace-nowrap sticky left-0 bg-white">{mes}</td>
                  {controleAnual.anos.map((ano, ai) => {
                    const mensal = controleAnual.porAno[ano][i];
                    const acumulado = controleAnual.porAno[ano].slice(0, i + 1).reduce((a, b) => a + b, 0);
                    const anoAnterior = controleAnual.anos[ai - 1];
                    let variacao = null;
                    if (anoAnterior !== undefined) {
                      const mensalAnterior = controleAnual.porAno[anoAnterior][i];
                      if (mensalAnterior > 0) variacao = ((mensal - mensalAnterior) / mensalAnterior) * 100;
                    }
                    return (
                      <React.Fragment key={ano}>
                        <td className="px-2 py-1.5 text-right tabular-nums text-slate-600 border-l border-slate-50 whitespace-nowrap">
                          {mensal > 0 ? fmtMoeda(mensal) : "—"}

                        <td className="px-2 py-1.5 text-right tabular-nums text-slate-400 whitespace-nowrap">
                          {acumulado > 0 ? fmtMoeda(acumulado) : "—"}
                        </td>
                        <td className="px-2 py-1.5 text-right whitespace-nowrap">
                          {variacao !== null ? (
                            <span
                              className="text-xs font-medium"
                              style={{ color: variacao >= 0 ? "#0F8A6B" : "#C4573D" }}
                            >

                            </span>
                          ) : (

                      </React.Fragment>
                    );
                  })}
                </tr>
              ))}
              <tr className="font-semibold bg-slate-50">
                <td className="px-3 py-2 text-slate-700 sticky left-0 bg-slate-50">TOTAL</td>
                {controleAnual.anos.map((ano, ai) => {
                  const totalAno = controleAnual.porAno[ano].reduce((a, b) => a + b, 0);
                  const anoAnterior = controleAnual.anos[ai - 1];
                  let variacao = null;
                  if (anoAnterior !== undefined) {
                    const totalAnterior = controleAnual.porAno[anoAnterior].reduce((a, b) => a + b, 0);
                    if (totalAnterior > 0) variacao = ((totalAno - totalAnterior) / totalAnterior) * 100;
                  }
                  return (
                    <React.Fragment key={ano}>
                      <td className="px-2 py-2 text-right border-l border-slate-100 whitespace-nowrap">
                        {fmtMoeda(totalAno)}
                      </td>
                      <td className="px-2 py-2 text-right whitespace-nowrap">{fmtMoeda(totalAno)}</td>
                      <td className="px-2 py-2 text-right whitespace-nowrap">
                        {variacao !== null ? (
                          <span style={{ color: variacao >= 0 ? "#0F8A6B" : "#C4573D" }}>
                            {variacao >= 0 ? "▲" : "▼"} {Math.abs(variacao).toFixed(1)}%
                          </span>
                        ) : (
                          "—"
                        )}
                      </td>
                    </React.Fragment>
                  );
                })}
              </tr>
            </tbody>
          </table>
        </div>
      )}

      <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-md px-3 py-2 max-w-md shadow-sm">
        <Search size={14} className="text-slate-400" />
        <input
          value={busca}
          onChange={(e) => setBusca(e.target.value)}
          placeholder="Buscar por nº, cliente ou descrição"
          className="bg-transparent text-sm outline-none w-full placeholder:text-slate-400"
        />
      </div>

      {/* Seletor de mês, e tabela detalhada só do mês escolhido */}

          return (

                    Propostas Aprovadas Mês {g.mes}/{g.ano.slice(2)}

                    <span className="inline-flex items-center gap-1.5">
                      <span
                        className="px-2 py-0.5 rounded-full font-medium"
                        style={{ backgroundColor: "#0F8A6B1a", color: "#0F8A6B" }}

                        Aprovado
                      </span>
                      Proposta aprovada — valores contabilizados no total

                    <span className="inline-flex items-center gap-1.5">
